<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skat lernen</title>
<meta name="description" content="Skat lernen vom Einsteiger zum ernstzunehmenden Spieler: Lektionen, Übungen und Übungsspiele gegen den Computer.">
<meta name="theme-color" content="#1c5a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skat">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Young+Serif&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: Lernpfad wie ein Skatblock (linierte Zeilen, Wertungsspalte rechts); Spieltisch als Filz in voller Höhe. */
:root {
  --paper: #f2f5f3;
  --paper-2: #ffffff;
  --ink: #15211c;
  --muted: #5a6a63;
  --rule: #d6e0db;
  --felt: #1c5a45;
  --felt-hi: #24705a;
  --felt-ink: #eaf3ee;
  --brass: #b8861c;
  --brass-soft: #f3e6c4;
  --accent: #1c5a45;
  --accent-ink: #ffffff;
  --ok: #24804f;
  --ok-soft: #dcefe3;
  --bad: #b6352c;
  --bad-soft: #f6e0dd;
  --card-bg: #fffefb;
  --card-edge: #d9d6cc;
  --back-a: #7c2230;
  --back-b: #5e1824;
  --kreuz: #1d1d1b;
  --pik: #19803a;
  --herz: #d0262d;
  --karo: #e07d00;
  --shadow: 0 1px 2px rgba(20, 35, 28, .08), 0 4px 14px rgba(20, 35, 28, .08);
  --font-display: 'Young Serif', 'Iowan Old Style', Georgia, serif;
  --font-body: 'Source Sans 3', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 14px;
  --tab-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1714; --paper-2: #16211c; --ink: #e4ece7; --muted: #93a59c; --rule: #26352e;
    --felt: #103b2e; --felt-hi: #175140; --felt-ink: #e4efe9; --brass: #d6a53c; --brass-soft: #3a3020;
    --accent: #3d9c78; --accent-ink: #06130e; --ok: #4cbc7e; --ok-soft: #173426; --bad: #e06a5f; --bad-soft: #3a1d1a;
    --card-bg: #f1efe8; --card-edge: #b9b5a8; --back-a: #6c1d29; --back-b: #4b121c;
    --kreuz: #1d1d1b; --pik: #157034; --herz: #c42229; --karo: #cf7000;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1714; --paper-2: #16211c; --ink: #e4ece7; --muted: #93a59c; --rule: #26352e;
  --felt: #103b2e; --felt-hi: #175140; --felt-ink: #e4efe9; --brass: #d6a53c; --brass-soft: #3a3020;
  --accent: #3d9c78; --accent-ink: #06130e; --ok: #4cbc7e; --ok-soft: #173426; --bad: #e06a5f; --bad-soft: #3a1d1a;
  --card-bg: #f1efe8; --card-edge: #b9b5a8; --back-a: #6c1d29; --back-b: #4b121c;
  --kreuz: #1d1d1b; --pik: #157034; --herz: #c42229; --karo: #cf7000;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

html, body { height: 100%; }
body.felt { background: var(--felt); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.page { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; display: flex; flex-direction: column; gap: 18px; }

/* Tab-Leiste */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--paper-2); border-top: 1px solid var(--rule); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: var(--tab-h); text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.tabbar a svg { width: 24px; height: 24px; }
.tabbar a.on { color: var(--accent); }
.app.fullscreen .tabbar { display: none; }

/* Kopf */
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 30px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: none; }

/* Stufenanzeige */
.levelcard { background: var(--felt); color: var(--felt-ink); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.levelcard::after { content: ""; position: absolute; right: -18px; top: -26px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.10), transparent 70%); }
.levelcard .lv { display: flex; align-items: center; gap: 12px; }
.levelcard .num { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--brass); display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; color: var(--brass); flex: none; }
.levelcard h2 { font-size: 22px; }
.levelcard .sub { font-size: 14px; opacity: .85; }
.ladder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.ladder span { height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); }
.ladder span.on { background: var(--brass); }
.ladder span.part { background: linear-gradient(90deg, var(--brass) var(--p), rgba(255,255,255,.18) var(--p)); }

/* Skatblock-Liste */
.block { background: var(--paper-2); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.block-h { padding: 14px 16px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 2px solid var(--ink); }
.block-h h3 { font-size: 19px; }
.block-h .eyebrow { white-space: nowrap; }
.row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--rule); text-decoration: none; min-height: 52px; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row .t { font-weight: 600; }
.row .d { font-size: 13px; color: var(--muted); }
.row .mark { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--rule); display: grid; place-items: center; font-size: 13px; color: var(--accent-ink); }
.row .mark.done { background: var(--ok); border-color: var(--ok); }
.row .mark.part { border-color: var(--brass); }
.row .score { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; padding-left: 12px; border-left: 1px solid var(--rule); min-width: 52px; text-align: right; color: var(--muted); }
.row .score.good { color: var(--ok); }
.row.locked { opacity: .55; }

.nextup { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--brass-soft); border-radius: var(--r); padding: 14px 16px; text-decoration: none; }
.nextup .t { font-family: var(--font-display); font-size: 19px; }
.nextup .d { font-size: 14px; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.btn.soft { background: var(--paper-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.btn.brass { background: var(--brass); color: #1c1405; }
.btn.small { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 140px; }

/* Lektion */
.lesson { display: flex; flex-direction: column; gap: 14px; }
.lesson h1 { font-size: 28px; }
.lpage { background: var(--paper-2); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); font-size: 17px; line-height: 1.55; max-width: 65ch; }
.lpage.new { animation: rise .35s ease both; }
.lpage b { font-weight: 700; }
.lpage .formula { font-family: var(--font-display); font-size: 22px; text-align: center; padding: 8px 0; }
table.pts { border-collapse: collapse; margin: 8px 0; font-variant-numeric: tabular-nums; }
table.pts td { padding: 3px 14px 3px 0; border-bottom: 1px solid var(--rule); }
table.pts td:last-child { font-weight: 700; text-align: right; }
.steps { display: flex; gap: 5px; }
.steps span { flex: 1; height: 4px; border-radius: 2px; background: var(--rule); }
.steps span.on { background: var(--accent); }
@keyframes rise { from { transform: translateY(8px); opacity: .0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Karten */
.card { --w: var(--cw, 62px); width: var(--w); height: calc(var(--w) * 1.42); border-radius: calc(var(--w) * .11); background: var(--card-bg); border: 1px solid var(--card-edge); box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 3px 8px rgba(0,0,0,.18); position: relative; color: var(--sc); flex: none; user-select: none; -webkit-user-select: none; padding: 0; font-family: var(--font-body); }
.card .ix { position: absolute; left: 6%; top: 4%; display: flex; flex-direction: column; align-items: center; line-height: .92; font-weight: 700; font-size: calc(var(--w) * .28); letter-spacing: -.03em; }
.card .ix i { font-style: normal; font-size: calc(var(--w) * .25); }
.card .pip { position: absolute; left: 22%; right: 6%; top: 18%; bottom: 8%; display: grid; place-items: center; font-size: calc(var(--w) * .58); line-height: 1; }
.card .pip.face { font-family: var(--font-display); font-size: calc(var(--w) * .5); }
.card .pip.face small { display: block; font-family: var(--font-body); font-size: .5em; text-align: center; margin-top: 2px; }
.card .pip.face span { display: grid; justify-items: center; }
.card.jack .pip.face { color: var(--sc); }
.card.jack::after { content: ""; position: absolute; inset: 3px; border-radius: calc(var(--w) * .08); border: 1.5px solid color-mix(in srgb, var(--sc) 35%, transparent); pointer-events: none; }
.s0 { --sc: var(--karo); } .s1 { --sc: var(--herz); } .s2 { --sc: var(--pik); } .s3 { --sc: var(--kreuz); }
/* deutsches Blatt: Farbzeichen als SVG */
.deck-de .s0 { --sc: #a86300; } .deck-de .s1 { --sc: #c42229; } .deck-de .s2 { --sc: #2c7a2c; } .deck-de .s3 { --sc: #5b391b; }
.si { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex: none; }
.card .ix i .si { display: block; margin-top: 2px; width: .95em; height: .95em; }
.card .pip > .si { width: .92em; height: .92em; display: block; }
.card .pip.face small .si { width: 1.05em; height: 1.05em; display: inline-block; vertical-align: top; }
.chip .si { width: .95em; height: .95em; margin-right: 1px; align-self: center; }
.gn .si { width: 1.1em; height: 1.1em; }
.card.back { background: repeating-linear-gradient(45deg, var(--back-a) 0 6px, var(--back-b) 6px 12px); border: 3px solid var(--card-bg); }
.card.trumpmark::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; border-radius: 0 0 calc(var(--w) * .1) calc(var(--w) * .1); background: var(--brass); opacity: .85; }
.crow { display: flex; flex-wrap: wrap; gap: 6px; --cw: 42px; margin: 10px 0 4px; }
.crow .card .ix { font-size: calc(var(--w) * .32); }
.chip { display: inline-flex; align-items: baseline; gap: 1px; padding: 0 .32em; margin: 0 .05em; border-radius: 5px; background: var(--card-bg); color: var(--sc); border: 1px solid var(--card-edge); font-weight: 700; line-height: 1.35; white-space: nowrap; font-size: .95em; }

/* Übung */
.qcard { background: var(--paper-2); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.qtext { font-size: 17px; }
.qtext .game, .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--felt); color: var(--felt-ink); padding: 2px 8px; border-radius: 6px; margin-right: 6px; vertical-align: 2px; }
.opts { display: grid; gap: 10px; }
.opt { min-height: 52px; border-radius: 12px; border: 0; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--rule); padding: 10px 14px; text-align: left; font-size: 17px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.opt.right { box-shadow: inset 0 0 0 2px var(--ok); background: var(--ok-soft); }
.opt.wrong { box-shadow: inset 0 0 0 2px var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.feedback { border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.5; animation: rise .25s ease both; }
.feedback.ok { background: var(--ok-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback.mid { background: var(--brass-soft); }
.feedback b.h { display: block; font-size: 16px; margin-bottom: 2px; }
.feedback ul { margin: 6px 0; padding-left: 18px; }
.note { font-size: 13px; color: var(--muted); }
.pickhand { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; --cw: 58px; }
.pickhand .card { cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
.pickhand .card.sel { transform: translateY(-10px); box-shadow: 0 0 0 3px var(--brass), 0 6px 14px rgba(0,0,0,.25); }
.pickhand .card.good { box-shadow: 0 0 0 3px var(--ok); }
.pickhand .card.badpick { box-shadow: 0 0 0 3px var(--bad); }
.pickhand .card.dim { filter: saturate(.3) brightness(.85); }
.minitrick { display: flex; gap: 10px; justify-content: center; align-items: flex-end; --cw: 54px; padding: 12px; background: var(--felt); border-radius: 12px; flex-wrap: wrap; }
.minitrick figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--felt-ink); font-size: 12px; font-weight: 600; }
.minitrick .card.tap { cursor: pointer; }
.minitrick .card.good { box-shadow: 0 0 0 3px var(--ok); }
.minitrick .card.badpick { box-shadow: 0 0 0 3px var(--bad); }
.tricklist { display: grid; gap: 6px; --cw: 34px; }
.tricklist .tl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.tricklist .tl .card .ix { font-size: calc(var(--w) * .36); }
.dots { display: flex; gap: 6px; }
.dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--rule); }
.dots span.ok { background: var(--ok); } .dots span.no { background: var(--bad); } .dots span.cur { background: var(--brass); }
.result-big { font-family: var(--font-display); font-size: 48px; line-height: 1; }

/* Spieltisch */
.table { position: relative; height: 100%; display: flex; flex-direction: column; background: radial-gradient(ellipse 120% 70% at 50% 38%, var(--felt-hi), var(--felt) 70%); color: var(--felt-ink); overflow: hidden; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 4px; }
.tbar button, .tbar a { background: rgba(255,255,255,.1); border: 0; color: var(--felt-ink); height: 36px; padding: 0 12px; border-radius: 10px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; cursor: pointer; }
.tbar .ttl { font-size: 13px; opacity: .8; text-align: center; flex: 1; font-variant-numeric: tabular-nums; }
.opps { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 12px; }
.opp { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.opp.r { align-items: flex-end; text-align: right; }
.opp .who { display: flex; align-items: center; gap: 8px; }
.opp.r .who { flex-direction: row-reverse; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 18px; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.25); flex: none; }
.opp.turn .avatar, .me.turn .avatar { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(214,165,60,.35); }
.opp .nm { font-weight: 700; font-size: 15px; line-height: 1.1; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; }
.opp.r .badges { justify-content: flex-end; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.14); white-space: nowrap; }
.badge.decl { background: var(--brass); color: #1c1405; }
.backs { display: flex; height: 26px; --cw: 18px; }
.opp.r .backs { flex-direction: row-reverse; }
.backs .card { margin-left: -12px; box-shadow: none; border-width: 2px; }
.opp.r .backs .card { margin-left: 0; margin-right: -12px; }
.backs .card:first-child { margin-left: 0; margin-right: 0; }
.bubble { align-self: flex-start; background: var(--card-bg); color: #1d1d1b; font-weight: 700; padding: 3px 10px; border-radius: 12px; font-size: 14px; }
.opp.r .bubble { align-self: flex-end; }
.openhand { display: flex; flex-wrap: wrap; gap: 3px; max-width: 100%; }
.opp.r .openhand { justify-content: flex-end; }
.center { flex: 1; min-height: 150px; position: relative; display: flex; align-items: center; justify-content: center; }
.trick { position: relative; width: 230px; height: 170px; --cw: min(19vw, 76px); }
.trick .slot { position: absolute; transition: transform .25s ease, opacity .25s ease; }
.trick .slot.p1 { left: 8px; top: 6px; transform: rotate(-8deg); }
.trick .slot.p2 { right: 8px; top: 6px; transform: rotate(8deg); }
.trick .slot.p0 { left: 50%; bottom: 0; margin-left: calc(var(--cw) / -2); }
.trick.collect .slot { opacity: .0; }
.trick.collect.to0 .slot { transform: translateY(80px) scale(.6); }
.trick.collect.to1 .slot { transform: translate(-120px, -60px) scale(.6); }
.trick.collect.to2 .slot { transform: translate(120px, -60px) scale(.6); }
.skatpile { display: flex; gap: 6px; --cw: 52px; }
.msg { flex: none; min-height: 44px; padding: 6px 14px; text-align: center; font-size: 15px; line-height: 1.35; display: flex; align-items: center; justify-content: center; }
.msg .coach { background: var(--card-bg); color: #1d1d1b; border-radius: 12px; padding: 8px 12px; font-size: 14px; text-align: left; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.msg .coach b { color: var(--felt); }
.infobar { flex: none; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 2px 12px 6px; font-size: 13px; font-variant-numeric: tabular-nums; }
.infobar span { background: rgba(0,0,0,.18); padding: 2px 9px; border-radius: 8px; }
.actions { flex: none; display: flex; gap: 8px; justify-content: center; padding: 0 12px 8px; flex-wrap: wrap; }
.actions .btn { min-height: 40px; font-size: 15px; padding: 0 14px; }
.tbtn { background: rgba(255,255,255,.12); color: var(--felt-ink); }
.table.haspanel .center { min-height: 0; }
.panel { flex: none; margin: 0 12px 8px; background: var(--paper-2); color: var(--ink); border-radius: 16px; padding: 12px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 10px; max-height: 46vh; overflow-y: auto; }
.panel h3 { font-size: 18px; }
.panel .advice { font-size: 14px; background: var(--brass-soft); border-radius: 10px; padding: 8px 10px; }
.panel .advice ul { margin: 4px 0 0; padding-left: 18px; }
.gamegrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(8, 16, 12, .55); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease both; }
.sheet .inner { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--paper-2); color: var(--ink); border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .25s ease both; }
@keyframes fade { from { opacity: 0; } }

/* Liste (Skatblock) */
.scroll-x { overflow-x: auto; }

table.liste td.neg { color: var(--bad); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--paper-2); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--paper); border-radius: 12px; padding: 3px; gap: 3px; box-shadow: inset 0 0 0 1px var(--rule); }
.seg button { border: 0; background: none; border-radius: 9px; min-height: 40px; font-weight: 600; cursor: pointer; font-size: 14px; }
.seg button.on { background: var(--paper-2); box-shadow: var(--shadow); color: var(--accent); }
.setting { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.setting:last-child { border-bottom: 0; }
.setting .d { font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 15px; max-width: min(92vw, 460px); text-align: center; box-shadow: var(--shadow); animation: toastin .2s ease both; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.sheet.noanim, .sheet.noanim .inner { animation: none; }

@media (max-width: 380px) {

}

}

/* Einstieg, Erklärungen, Begriffe */

.row .score svg { width: 22px; height: 22px; vertical-align: middle; color: var(--accent); }
.how { font-size: 14px; line-height: 1.45; color: var(--muted); background: var(--paper); border-radius: 10px; padding: 8px 12px; }

ol.think { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 6px; }

.term { border-bottom: 1.5px dotted currentColor; cursor: pointer; border-radius: 2px; }

#gloss h3 { font-size: 22px; }

.panel.guide { gap: 8px; font-size: 15px; line-height: 1.45; max-height: 50vh; }
.panel.guide .gtext { font-size: 15px; line-height: 1.45; }

  .table.guided .infobar, .table.guided .meline { display: none; }
}

.block.later .row { opacity: .62; }
.later-note { font-size: 13px; color: var(--muted); padding: 8px 16px 2px; margin: 0; }

/* ===== Lernpfad, Tagesplan, Serie ===== */
:root { --fire: #d9540b; --joker: #3f86bd; --u1: #23755a; --u1d: #154a39; --u2: #bf8a1a; --u2d: #8a6210; --u3: #bd3b31; --u3d: #86241d; --u4: #8a5a2b; --u4d: #5c3a18; --u5: #2f4673; --u5d: #1b2b4b; }
.ic { width: 1.15em; height: 1.15em; flex: none; }
.home .brand, .page > .brand { align-items: center; }
.home .brand h1 { font-size: 26px; }
.hud { display: flex; gap: 6px; align-items: center; }
.hud-i { display: inline-flex; align-items: center; gap: 3px; min-height: 34px; padding: 0 10px; border-radius: 999px; background: var(--paper-2); box-shadow: var(--shadow); font-weight: 800; font-size: 15px; text-decoration: none; font-variant-numeric: tabular-nums; }
.hud-i small { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.hud-i.fire { color: var(--muted); } .hud-i.fire.lit { color: var(--fire); }
.hud-i.bolt .ic { color: var(--brass); }
.intro { background: var(--brass-soft); border-radius: 14px; padding: 12px 14px; font-size: 15px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.week i { display: grid; place-items: center; width: 30px; height: 30px; margin: 0 auto 3px; border-radius: 50%; background: var(--rule); color: #fff; font-style: normal; }
.week i .ic { width: 16px; height: 16px; }
.week .on i { background: var(--fire); }
.week .joker i { background: var(--joker); }
.week .now { color: var(--ink); } .week .now i { outline: 2px solid var(--brass); outline-offset: 2px; }
.week .future { opacity: .55; }
.goalhit { display: flex; gap: 12px; align-items: center; background: var(--ok-soft); border-radius: 14px; padding: 12px 14px; font-size: 15px; }
.goalhit > .ic { width: 30px; height: 30px; color: var(--ok); }
.today { background: var(--felt); color: var(--felt-ink); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.today .eyebrow { color: inherit; opacity: .75; }
.today-h { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.today h2 { font-size: 25px; margin-top: 2px; }
.today .pace { font-size: 13px; opacity: .85; margin-top: 4px; }
.today.fin p { font-size: 15px; opacity: .92; }
.ring { width: 58px; height: 58px; flex: none; }
.ring .rt { fill: none; stroke: rgba(255, 255, 255, .2); stroke-width: 5; }
.ring .rv { fill: none; stroke: var(--brass); stroke-width: 5; stroke-linecap: round; }
.ring text { fill: currentColor; font-size: 12px; font-weight: 800; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tasks li > a, .tasks li > .a { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(255, 255, 255, .08); text-decoration: none; color: inherit; min-height: 52px; }
.tasks .tk { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .14); }
.tasks .tk svg { width: 18px; height: 18px; }
.tasks .t { display: block; font-weight: 700; line-height: 1.25; }
.tasks .d { display: block; font-size: 13px; opacity: .8; line-height: 1.3; }
.tasks .pv { font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.tasks li.done .tk { background: var(--brass); color: #1c1405; }
.tasks li.done .tx { opacity: .65; }
.tasks li.next > a { background: rgba(255, 255, 255, .16); box-shadow: inset 0 0 0 2px var(--brass); }
.tasks.plain li > a, .tasks.plain li > .a { background: var(--paper); }
.tasks.plain .tk { background: var(--rule); }
.tasks.plain li.done .tk { background: var(--ok); color: #fff; }
.btn.big { min-height: 54px; font-size: 17px; border-radius: 14px; box-shadow: 0 4px 0 rgba(0, 0, 0, .22); width: 100%; }
.btn.big:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, .22); }
.btn.ghostw { background: transparent; color: inherit; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .5); }
.path { display: flex; flex-direction: column; }
.unit { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--uc); color: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: 0 5px 0 var(--ud); margin-top: 14px; }
.unit h3 { font-size: 21px; } .unit p { font-size: 13px; opacity: .92; margin-top: 2px; } .unit .eyebrow { color: inherit; opacity: .8; }
.ucount { font-weight: 800; background: rgba(0, 0, 0, .2); padding: 4px 10px; border-radius: 999px; font-size: 13px; white-space: nowrap; }
.u1 { --uc: var(--u1); --ud: var(--u1d); } .u2 { --uc: var(--u2); --ud: var(--u2d); } .u3 { --uc: var(--u3); --ud: var(--u3d); } .u4 { --uc: var(--u4); --ud: var(--u4d); } .u5 { --uc: var(--u5); --ud: var(--u5d); }
.jump { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--muted); text-decoration: none; padding: 10px; border: 2px dashed var(--rule); border-radius: 12px; margin-top: 14px; }
.nodes { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0 6px; }
.node { transform: translateX(var(--x)); display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; position: relative; }
.node .disc { width: 68px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: var(--uc); color: #fff; box-shadow: 0 6px 0 var(--ud); font-family: var(--font-display); font-size: 25px; }
.node .disc .ic { width: 30px; height: 30px; }
.node .nl { font-size: 12px; color: var(--muted); max-width: 150px; line-height: 1.25; text-align: center; }
.node .nl b { color: var(--ink); display: block; }
.node.locked .disc { background: var(--rule); color: var(--muted); box-shadow: 0 6px 0 color-mix(in srgb, var(--rule) 70%, #000); }
.node.locked .disc .ic { width: 24px; height: 24px; }
.node.cur .disc { outline: 4px solid color-mix(in srgb, var(--uc) 35%, transparent); outline-offset: 5px; }
.node:active .disc { transform: translateY(4px); box-shadow: 0 2px 0 var(--ud); }
.startb { background: var(--paper-2); color: var(--uc); font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 6px 12px; border-radius: 10px; box-shadow: var(--shadow), inset 0 0 0 2px var(--rule); position: relative; margin-bottom: 4px; animation: bob 1.6s ease-in-out infinite; }
.startb::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; background: var(--paper-2); transform: translateX(-50%) rotate(45deg); box-shadow: inset -2px -2px 0 var(--rule); }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes pop { from { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.08); } to { transform: none; opacity: 1; } }

/* ===== Einheit (Lektion, Übung, Test) ===== */
.sess { height: 100%; display: flex; flex-direction: column; background: var(--paper); }
.sbar { flex: none; display: flex; align-items: center; gap: 12px; width: 100%; max-width: 640px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }
.sx { width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); border-radius: 50%; }
.sx .ic { width: 24px; height: 24px; }
.sprog { flex: 1; height: 16px; border-radius: 8px; background: var(--rule); overflow: hidden; }
.sprog i { display: block; height: 100%; border-radius: 8px; background: var(--ok); background-image: linear-gradient(rgba(255, 255, 255, .35), rgba(255, 255, 255, 0) 55%); transition: width .35s ease; }
.scombo { display: inline-flex; align-items: center; gap: 2px; color: var(--fire); font-weight: 800; font-variant-numeric: tabular-nums; animation: pop .3s ease both; }
.sbody { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sin { max-width: 640px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sess .ltitle { font-size: 28px; }
.sess .lpage { font-size: 18px; }
.sess .qtext { font-size: 19px; font-weight: 600; line-height: 1.4; }
.sess .opt { background: var(--paper-2); box-shadow: inset 0 0 0 2px var(--rule), 0 3px 0 var(--rule); }
.sess .opt:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--rule), 0 1px 0 var(--rule); }
.sess .opt.right { box-shadow: inset 0 0 0 2px var(--ok); background: var(--ok-soft); }
.sess .opt.wrong { box-shadow: inset 0 0 0 2px var(--bad); background: var(--bad-soft); }
.qhead .again { display: inline-flex; gap: 6px; align-items: center; color: var(--fire); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
details.how > summary { cursor: pointer; font-weight: 700; color: var(--ink); }
details.how[open] > summary { margin-bottom: 4px; }
.tricklist .tn { width: 18px; }
.tricklist.named .tc { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.tricklist.named .tc small { font-size: 10px; line-height: 1; }
.ghostcard { opacity: .25; background: transparent; border: 2px dashed currentColor; box-shadow: none; }
.sfoot { flex: none; border-top: 2px solid var(--rule); background: var(--paper-2); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
.sfoot > * { width: 100%; max-width: 608px; margin-inline: auto; }
.sfoot.fb { border-color: transparent; animation: rise .2s ease both; }
.sfoot.fb.ok { background: var(--ok-soft); } .sfoot.fb.no { background: var(--bad-soft); } .sfoot.fb.mid { background: var(--brass-soft); }
.fbh { display: flex; align-items: center; gap: 8px; font-size: 20px; color: var(--ok); }
.fbh .ic { width: 28px; height: 28px; padding: 5px; border-radius: 50%; background: var(--ok); color: #fff; }
.sfoot.no .fbh { color: var(--bad); } .sfoot.no .fbh .ic { background: var(--bad); }
.sfoot.mid .fbh { color: var(--ink); } .sfoot.mid .fbh .ic { background: var(--brass); }
.fbt { font-size: 15px; line-height: 1.45; max-height: 32vh; overflow-y: auto; }
.fbt .note { margin-top: 6px; }
.sfoot.ok .btn.big { background: var(--ok); color: var(--accent-ink); }
.sfoot.no .btn.big { background: var(--bad); color: var(--accent-ink); }
.sumin { align-items: center; text-align: center; padding-top: 32px; }
.burst { width: 96px; height: 96px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; animation: pop .45s ease both; box-shadow: 0 6px 0 color-mix(in srgb, var(--ok) 70%, #000); }
.burst .ic { width: 52px; height: 52px; }
.sess.fail .burst { background: var(--brass); box-shadow: 0 6px 0 color-mix(in srgb, var(--brass) 70%, #000); }
.sumin h1 { font-size: 30px; }
.sumsub { color: var(--muted); max-width: 40ch; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.tile { border-radius: 14px; background: var(--tc); padding: 2px; display: flex; flex-direction: column; animation: rise .4s ease both; }
.tile span { color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 4px 2px; }
.tile b { background: var(--paper-2); border-radius: 12px; padding: 12px 2px; font-size: 19px; font-variant-numeric: tabular-nums; }
.tile.xp { --tc: var(--brass); } .tile.acc { --tc: var(--ok); animation-delay: .1s; } .tile.time { --tc: var(--joker); animation-delay: .2s; }
.sline { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--paper-2); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); font-size: 14px; animation: rise .4s ease both; animation-delay: .3s; }
.sline b { display: block; font-size: 16px; }
.sline > .ic { width: 30px; height: 30px; }
.sline.fire > .ic { color: var(--fire); } .sline.day > .ic { color: var(--ok); } .sline.ach > .ic { color: var(--brass); }

/* ===== Üben, Fortschritt ===== */
.reviewcard { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--felt); color: var(--felt-ink); border-radius: 16px; padding: 14px 16px; text-decoration: none; box-shadow: var(--shadow); }
.reviewcard.off { opacity: .6; }

<body>
<div id="app" class="app">
  <main id="screen" class="screen"></main>
  <nav class="tabbar" aria-label="Bereiche">
    <a href="#lernen" data-tab="lernen"><span>Lernen</span></a>
    <a href="#ueben" data-tab="ueben"><span>Üben</span></a>
    <a href="#spielen" data-tab="spielen"><span>Spielen</span></a>
    <a href="#fortschritt" data-tab="fortschritt"><span>Fortschritt</span></a>
  </nav>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* Skat-Regelwerk nach Internationaler Skatordnung (ISkO).
 * Karten: id = farbe * 8 + rang
 *   farbe: 0 Karo, 1 Herz, 2 Pik, 3 Kreuz
 *   rang:  0 7, 1 8, 2 9, 3 Dame, 4 König, 5 Zehn, 6 Ass, 7 Bube
 * Spielart (gt): 0-3 Farbspiel (Trumpffarbe), 4 Grand, 5 Null
 */
(function (G) {
  'use strict';

  const SUIT_NAMES = ['Karo', 'Herz', 'Pik', 'Kreuz'];
  const SUIT_SYM = ['♦', '♥', '♠', '♣'];
  const RANK_SHORT = ['7', '8', '9', 'D', 'K', '10', 'A', 'B'];
  const RANK_NAMES = ['Sieben', 'Acht', 'Neun', 'Dame', 'König', 'Zehn', 'Ass', 'Bube'];
  const POINTS = [0, 0, 0, 3, 4, 10, 11, 2];
  // Rangfolge im Nullspiel: 7 8 9 10 B D K A
  const NULL_STR = [0, 1, 2, 5, 6, 3, 7, 4];
  const GT_GRAND = 4, GT_NULL = 5;
  const GAME_NAMES = ['Karo', 'Herz', 'Pik', 'Kreuz', 'Grand', 'Null'];
  const BASE = [9, 10, 11, 12, 24];
  const JACKS = [31, 23, 15, 7]; // Kreuz-, Pik-, Herz-, Karo-Bube

  // Kartenbild: französisch (Kreuz, Pik, Herz, Karo) oder deutsch (Eichel, Grün, Rot, Schellen)
  const DECKS = {
    fr: { suits: ['Karo', 'Herz', 'Pik', 'Kreuz'], ranks: ['Sieben', 'Acht', 'Neun', 'Dame', 'König', 'Zehn', 'Ass', 'Bube'], short: ['7', '8', '9', 'D', 'K', '10', 'A', 'B'] },
    de: { suits: ['Schellen', 'Rot', 'Grün', 'Eichel'], ranks: ['Sieben', 'Acht', 'Neun', 'Ober', 'König', 'Zehn', 'Ass', 'Unter'], short: ['7', '8', '9', 'O', 'K', '10', 'A', 'U'] },
  };
  let DECK = 'fr';
  function setDeck(id) {
    const d = DECKS[id] ? id : 'fr';
    DECK = d;
    const x = DECKS[d];
    for (let i = 0; i < 4; i++) { SUIT_NAMES[i] = x.suits[i]; GAME_NAMES[i] = x.suits[i]; }
    for (let i = 0; i < 8; i++) { RANK_NAMES[i] = x.ranks[i]; RANK_SHORT[i] = x.short[i]; }
    return d;
  }
  const deck = () => DECK;

  const suitOf = (c) => c >> 3;
  const rankOf = (c) => c & 7;
  const pts = (c) => POINTS[c & 7];
  const card = (s, r) => s * 8 + r;
  const sumPts = (cards) => cards.reduce((a, c) => a + POINTS[c & 7], 0);

  function cardName(c) {
    return SUIT_NAMES[suitOf(c)] + '-' + RANK_NAMES[rankOf(c)];
  }
  function cardShort(c) {
    return SUIT_SYM[suitOf(c)] + RANK_SHORT[rankOf(c)];
  }

  function isTrump(c, gt) {
    if (gt === GT_NULL) return false;
    if ((c & 7) === 7) return true;
    return gt < 4 && (c >> 3) === gt;
  }
  // effektive Farbe: 4 = Trumpf
  function effSuit(c, gt) {
    return isTrump(c, gt) ? 4 : c >> 3;
  }
  // Stärke innerhalb der effektiven Farbe
  function strength(c, gt) {
    const r = c & 7;
    if (gt === GT_NULL) return NULL_STR[r];
    if (r === 7) return 20 + (c >> 3);
    return r;
  }
  // Schlägt Karte a die bisher beste Karte b (b gehört zur Ausspielfarbe oder ist Trumpf)?
  function beats(a, b, gt) {
    const ea = effSuit(a, gt), eb = effSuit(b, gt);
    if (ea === eb) return strength(a, gt) > strength(b, gt);
    return ea === 4;
  }
  function trickWinnerIndex(cards, gt) {
    let best = 0;
    for (let i = 1; i < cards.length; i++) if (beats(cards[i], cards[best], gt)) best = i;
    return best;
  }
  function legalCards(hand, trickCards, gt) {
    if (!trickCards.length) return hand.slice();
    const le = effSuit(trickCards[0], gt);
    const f = hand.filter((c) => effSuit(c, gt) === le);
    return f.length ? f : hand.slice();
  }

  // Sortierung für die Handanzeige
  function sortHand(hand, gt) {
    const g = gt == null ? 3 : gt;
    const suitRank = (s) => {
      // Farben abwechselnd schwarz/rot: Kreuz, Herz, Pik, Karo
      const order = [3, 1, 2, 0];
      return order.indexOf(s);
    };
    return hand.slice().sort((a, b) => {
      const ea = effSuit(a, g), eb = effSuit(b, g);
      if (ea !== eb) {
        if (ea === 4) return -1;
        if (eb === 4) return 1;
        return suitRank(ea) - suitRank(eb);
      }
      return strength(b, g) - strength(a, g);
    });
  }

  // Spitzen (Matadore): {mit: bool, n}
  function matadorOrder(gt) {
    if (gt === GT_GRAND) return JACKS.slice();
    return JACKS.concat([6, 5, 4, 3, 2, 1, 0].map((r) => card(gt, r)));
  }
  function spitzen(cards, gt) {
    if (gt === GT_NULL) return { mit: false, n: 0 };
    const order = matadorOrder(gt);
    const set = new Set(cards);
    const mit = set.has(order[0]);
    let n = 0;
    for (const c of order) {
      if (set.has(c) === mit) n++;
      else break;
    }
    return { mit, n };
  }

  function nullValue(hand, ouvert) {
    if (ouvert) return hand ? 59 : 46;
    return hand ? 35 : 23;
  }

  // Stufen für ein Farb-/Grandspiel
  function levelsFor(p) {
    const sAng = !!(p.schneiderAng || p.schwarzAng || p.ouvert);
    const swAng = !!(p.schwarzAng || p.ouvert);
    const items = [];
    items.push({ label: (p.mit ? 'mit ' : 'ohne ') + p.n, v: p.n });
    items.push({ label: 'Spiel', v: 1 });
    if (p.hand) items.push({ label: 'Hand', v: 1 });
    if (p.schneider || sAng) items.push({ label: 'Schneider', v: 1 });
    if (sAng) items.push({ label: 'Schneider angesagt', v: 1 });
    if (p.schwarz || swAng) items.push({ label: 'Schwarz', v: 1 });
    if (swAng) items.push({ label: 'Schwarz angesagt', v: 1 });
    if (p.ouvert) items.push({ label: 'Ouvert', v: 1 });
    return items;
  }

  // Wert eines angesagten Spiels vor dem Ausspielen (ohne Schneider/Schwarz-Ergebnis)
  function announcedValue(gt, cards12, opts) {
    if (gt === GT_NULL) return nullValue(opts.hand, opts.ouvert);
    const sp = spitzen(cards12, gt);
    const items = levelsFor({ ...sp, hand: opts.hand, schneiderAng: opts.schneiderAng, schwarzAng: opts.schwarzAng, ouvert: opts.ouvert });
    return items.reduce((a, i) => a + i.v, 0) * BASE[gt];
  }

  // Alle möglichen Reizwerte
  const BID_VALUES = (() => {
    const s = new Set([23, 35, 46, 59]);
    for (const b of [9, 10, 11, 12]) for (let l = 2; l <= 18; l++) s.add(b * l);
    for (let l = 2; l <= 11; l++) s.add(24 * l);
    return [...s].filter((v) => v >= 18).sort((a, b) => a - b);
  })();
  function nextBid(v) {
    for (const b of BID_VALUES) if (b > v) return b;
    return null;
  }

  function gameLabel(game) {
    if (!game) return '';
    let s = GAME_NAMES[game.gt];
    if (game.gt === GT_NULL) {
      if (game.ouvert) s += ' ouvert';
      if (game.hand) s += ' Hand';
      return s;
    }
    if (game.hand) s += ' Hand';
    if (game.ouvert) s += ' ouvert';
    else if (game.schwarzAng) s += ', Schwarz angesagt';
    else if (game.schneiderAng) s += ', Schneider angesagt';
    return s;
  }

  // ---------- Ergebnis ----------
  // st: {declarer, bid, game:{gt,hand,schneiderAng,schwarzAng,ouvert}, declCards12, tricks:[{winner, cards:[{p,c}]}], skatPts}
  function evaluate(st) {
    const g = st.game;
    const gt = g.gt;
    let declPts = st.skatPts || 0;
    let declTricks = 0;
    for (const t of st.tricks) {
      if (t.winner === st.declarer) {
        declTricks++;
        declPts += sumPts(t.cards.map((x) => x.c));
      }
    }
    if (gt === GT_NULL) declPts = st.tricks.filter((t) => t.winner === st.declarer).reduce((a, t) => a + sumPts(t.cards.map((x) => x.c)), 0);
    const oppPts = 120 - declPts;
    const res = { gt, declPts, oppPts, declTricks, bid: st.bid, overbid: false, items: [], base: 0 };
    if (gt === GT_NULL) {
      res.won = declTricks === 0;
      res.value = nullValue(g.hand, g.ouvert);
      res.items = [{ label: gameLabel(g), v: res.value }];
      res.reason = res.won ? 'Der Alleinspieler hat keinen Stich bekommen.' : 'Der Alleinspieler hat einen Stich bekommen.';
    } else {
      const sp = spitzen(st.declCards12, gt);
      const schneider = declPts >= 90 || declPts <= 30;
      const schwarz = declTricks === st.tricks.length && st.tricks.length === 10 || declTricks === 0;
      const items = levelsFor({ ...sp, hand: g.hand, schneider, schwarz, schneiderAng: g.schneiderAng, schwarzAng: g.schwarzAng, ouvert: g.ouvert });
      const levels = items.reduce((a, i) => a + i.v, 0);
      res.base = BASE[gt];
      res.items = items;
      res.levels = levels;
      res.spitzen = sp;
      let won;
      if (g.schwarzAng || g.ouvert) {
        won = declTricks === 10;
        res.reason = won ? 'Alle Stiche gemacht – Schwarz wie angesagt.' : 'Schwarz war angesagt, aber die Gegner haben einen Stich bekommen.';
      } else if (g.schneiderAng) {
        won = declPts >= 90;
        res.reason = won ? 'Schneider wie angesagt erreicht (' + declPts + ' Augen).' : 'Schneider angesagt, aber nur ' + declPts + ' Augen.';
      } else {
        won = declPts >= 61;
        res.reason = won ? 'Der Alleinspieler hat ' + declPts + ' Augen (mindestens 61).' : 'Der Alleinspieler hat nur ' + declPts + ' Augen (61 nötig).';
      }
      res.value = levels * BASE[gt];
      res.won = won;
      if (res.value < st.bid) {
        res.overbid = true;
        res.won = false;
        res.valueBefore = res.value;
        res.value = Math.ceil(st.bid / BASE[gt]) * BASE[gt];
        res.reason = 'Überreizt: Das Spiel ist nur ' + res.valueBefore + ' wert, gereizt wurde ' + st.bid + '.';
      }
    }
    res.score = res.won ? res.value : -2 * res.value;
    // Seeger-Fabian: +50 / -50 für den Alleinspieler, +40 je Gegenspieler bei verlorenem Spiel
    res.sfDecl = res.won ? res.value + 50 : -2 * res.value - 50;
    res.sfOpp = res.won ? 0 : 40;
    return res;
  }

  // ---------- Spielzustand ----------
  function shuffled(rng) {
    const d = [];
    for (let i = 0; i < 32; i++) d.push(i);
    for (let i = 31; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = d[i]; d[i] = d[j]; d[j] = t;
    }
    return d;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Austeilen wie am Tisch: 3 - Skat 2 - 4 - 3
  function deal(dealer, rng) {
    const d = shuffled(rng || Math.random);
    const hands = [[], [], []];
    const skat = [];
    let i = 0;
    const order = [(dealer + 1) % 3, (dealer + 2) % 3, dealer];
    for (const p of order) for (let k = 0; k < 3; k++) hands[p].push(d[i++]);
    skat.push(d[i++], d[i++]);
    for (const p of order) for (let k = 0; k < 4; k++) hands[p].push(d[i++]);
    for (const p of order) for (let k = 0; k < 3; k++) hands[p].push(d[i++]);
    return { hands, skat };
  }

  function newGame(dealer, dealt) {
    const vh = (dealer + 1) % 3, mh = (dealer + 2) % 3, hh = dealer;
    return {
      phase: 'bidding',
      dealer, vh, mh, hh,
      hands: dealt.hands.map((h) => h.slice()),
      skat: dealt.skat.slice(),
      origHands: dealt.hands.map((h) => h.slice()),
      origSkat: dealt.skat.slice(),
      bidding: { stage: 1, sayer: mh, hearer: vh, bid: 0, waiting: 'say', winner: null, log: [], passed: [false, false, false] },
      declarer: null,
      bid: 0,
      game: null,
      skatTaken: false,
      discard: [],
      trick: [],
      leader: vh,
      turn: vh,
      tricks: [],
      voids: [[false, false, false, false, false], [false, false, false, false, false], [false, false, false, false, false]],
      result: null,
    };
  }

  // Wer ist beim Reizen am Zug?
  function biddingActor(st) {
    const b = st.bidding;
    if (b.waiting === 'say') return b.sayer;
    if (b.waiting === 'hear') return b.hearer;
    if (b.waiting === 'vh18') return st.vh;
    return null;
  }

  function finishBidding(st, declarer) {
    st.bidding.waiting = null;
    if (declarer == null) {
      st.phase = 'eingepasst';
      return;
    }
    st.declarer = declarer;
    st.bid = st.bidding.bid;
    st.phase = 'skat';
  }

  // action: {type:'say', value} | {type:'pass'} | {type:'yes'} | {type:'play18'}
  function bidAction(st, p, action) {
    const b = st.bidding;
    const log = (txt) => b.log.push({ p, txt });
    if (b.waiting === 'say') {
      if (p !== b.sayer) throw new Error('nicht am Zug');
      if (action.type === 'say') {
        if (action.value <= b.bid) throw new Error('zu niedrig');
        b.bid = action.value;
        log(String(action.value));
        b.waiting = 'hear';
        return;
      }
      if (action.type === 'pass') {
        log('Passe');
        b.passed[p] = true;
        nextStage(st, b.hearer);
        return;
      }
    } else if (b.waiting === 'hear') {
      if (p !== b.hearer) throw new Error('nicht am Zug');
      if (action.type === 'yes') {
        log('Ja');
        b.waiting = 'say';
        return;
      }
      if (action.type === 'pass') {
        log('Passe');
        b.passed[p] = true;
        nextStage(st, b.sayer);
        return;
      }
    } else if (b.waiting === 'vh18') {
      if (p !== st.vh) throw new Error('nicht am Zug');
      if (action.type === 'play18') {
        b.bid = 18;
        log('18');
        finishBidding(st, st.vh);
        return;
      }
      if (action.type === 'pass') {
        log('Passe');
        b.passed[p] = true;
        finishBidding(st, null);
        return;
      }
    }
    throw new Error('ungültige Reizaktion');
  }

  function nextStage(st, winner) {
    const b = st.bidding;
    if (b.stage === 1) {
      b.stage = 2;
      b.winner = winner;
      b.sayer = st.hh;
      b.hearer = winner;
      b.waiting = 'say';
      return;
    }
    // Stufe 2 beendet
    if (b.bid === 0) {
      // niemand hat etwas gesagt
      if (winner === st.vh && !b.passed[st.vh]) {
        b.stage = 3;
        b.waiting = 'vh18';
        return;
      }
      finishBidding(st, null);
      return;
    }
    finishBidding(st, winner);
  }

  function takeSkat(st) {
    st.hands[st.declarer] = st.hands[st.declarer].concat(st.skat);
    st.skatTaken = true;
    st.phase = 'discard';
  }

  function doDiscard(st, cards2) {
    const h = st.hands[st.declarer];
    if (cards2.length !== 2 || !cards2.every((c) => h.includes(c))) throw new Error('2 Karten drücken');
    st.discard = cards2.slice();
    st.hands[st.declarer] = h.filter((c) => !cards2.includes(c));
    st.phase = 'declare';
  }

  function playHand(st) {
    st.skatTaken = false;
    st.discard = st.skat.slice();
    st.phase = 'declare';
  }

  // game: {gt, hand, schneiderAng, schwarzAng, ouvert}
  function canDeclare(st, game) {
    const hand = !st.skatTaken;
    if (!!game.hand !== hand) return 'Hand nur, wenn der Skat nicht aufgenommen wurde.';
    if (game.gt === GT_NULL) {
      if (game.schneiderAng || game.schwarzAng) return 'Im Nullspiel gibt es kein Schneider/Schwarz.';
      if (nullValue(hand, game.ouvert) < st.bid) return 'Der Nullwert (' + nullValue(hand, game.ouvert) + ') liegt unter dem Reizwert ' + st.bid + '.';
      return null;
    }
    if ((game.schneiderAng || game.schwarzAng || game.ouvert) && !hand) return 'Schneider, Schwarz und Ouvert kann man nur beim Handspiel ansagen.';
    return null;
  }

  function declare(st, game) {
    const err = canDeclare(st, game);
    if (err) throw new Error(err);
    const g = { gt: game.gt, hand: !!game.hand, schneiderAng: !!(game.schneiderAng || game.schwarzAng || (game.ouvert && game.gt !== GT_NULL)), schwarzAng: !!(game.schwarzAng || (game.ouvert && game.gt !== GT_NULL)), ouvert: !!game.ouvert };
    st.game = g;
    st.declCards12 = st.hands[st.declarer].concat(st.discard);
    st.phase = 'play';
    st.leader = st.vh;
    st.turn = st.vh;
    st.trick = [];

  // ================= Einheit: Lektion, Übung, Wiederholung, Test =================
  let S = null;
  const quizQ = (l, i) => { const q = l.quiz[i]; return { kind: 'choice', text: q.q, options: q.o, answer: q.a, explain: q.why }; };
  const stepGen = (id, i) => ({ t: 'q', gen: id, gi: i, key: 'd:' + id });
  const stepQuiz = (l, i) => ({ t: 'q', q: quizQ(l, i), key: 'q:' + l.id + ':' + i, quiz: true });
  const stepTactic = (t) => ({ t: 'q', q: D.tacticQuestion(t), key: 't:' + t.id, tactic: t.id });
  function stepsForKey(k) {
    const [a, b, c] = k.split(':');
    if (a === 'd') return D.DRILLS[b] ? [stepGen(b, 9), stepGen(b, 9)] : [];
    if (a === 'q') { const l = LESSON(b); return l && l.quiz[c] ? [stepQuiz(l, Number(c))] : []; }
    const t = C.TACTICS.find((x) => x.id === b);
    return t ? [stepTactic(t)] : [];
  }
  const tacticAfter = (t) => (t.game === 'Null' ? 'nullspiel' : t.stage >= 4 ? 'zaehlen' : /^Alleinspieler/.test(t.role) ? 'alleinspieler' : 'gegenspieler');
  function tacticPool(n) {
    let pool = C.TACTICS.filter((t) => knows(tacticAfter(t)));
    if (pool.length < 4) pool = C.TACTICS.filter((t) => t.stage === 3);
    const box = (t) => (P.srs['t:' + t.id] ? P.srs['t:' + t.id].b : -1);
    return shuffle(pool.filter((t) => !P.tactics[t.id])).concat(shuffle(pool.filter((t) => P.tactics[t.id])).sort((a, b) => box(a) - box(b))).slice(0, n);
  }
  function unlockedKeys() {
    const ks = new Set();
    for (const l of C.LESSONS) if (knows(l.id)) { l.quiz.forEach((_, i) => ks.add('q:' + l.id + ':' + i)); if (l.drill) ks.add('d:' + l.drill); }
    for (const id of D.ORDER) if (P.drills[id]) ks.add('d:' + id);
    for (const t of C.TACTICS) if (knows(tacticAfter(t))) ks.add('t:' + t.id);
    return [...ks];
  }
  const dueKeys = () => PL.srsDue(P.srs, unlockedKeys(), today());
  function reviewSteps(n) {
    const all = unlockedKeys(), due = dueKeys();
    const steps = [], used = new Set();
    const add = (k) => { if (used.has(k) || steps.length >= n) return; used.add(k); for (const s of stepsForKey(k)) if (steps.length < n) steps.push(s); };
    const hard = due.filter((k) => k[0] !== 'q'), facts = due.filter((k) => k[0] === 'q');
    hard.slice(0, 3).forEach(add);
    facts.slice(0, 3).forEach(add);
    hard.forEach(add);
    shuffle(all.filter((k) => k[0] === 't' && !P.srs[k])).slice(0, 2).forEach(add);
    facts.forEach(add);
    const box = (k) => (P.srs[k] ? P.srs[k].b : 0);
    shuffle(all.filter((k) => k[0] !== 'q')).sort((a, b) => box(a) - box(b)).forEach(add);
    shuffle(all).forEach(add);
    return shuffle(steps);
  }
  function examSteps(n) {
    const steps = [], qs = [];
    const some = (a, k) => shuffle(a).slice(0, k);
    const drills = n < 5 ? D.ORDER.filter((id) => D.DRILLS[id].stage === n) : some(D.ORDER.filter((id) => D.DRILLS[id].stage >= 2), 6);
    for (const id of drills) steps.push(stepGen(id, 9), stepGen(id, 9));
    for (const l of C.LESSONS.filter((x) => (n < 5 ? x.stage === n : x.stage >= 4))) l.quiz.forEach((_, i) => qs.push(stepQuiz(l, i)));
    steps.push(...some(qs, 4), ...some(C.TACTICS.filter((t) => (n < 5 ? t.stage === n : true)), 4).map(stepTactic));
    return shuffle(steps);
  }
  function startSession(o) {
    S = Object.assign({ i: 0, ans: null, sel: [], seqAt: 0, res: {}, sum: 0, n: 0, combo: 0, quizOk: 0, t0: Date.now(), done: false, out: null, back: lastMain }, o);
    renderSession();
  }
  function viewLesson(id) {
    const l = LESSON(id);
    const steps = l.pages.map((p, i) => ({ t: 'info', html: p, at: i + 1, of: l.pages.length }));
    l.quiz.forEach((_, i) => steps.push(stepQuiz(l, i)));
    if (l.drill) for (let i = 0; i < 3; i++) steps.push(stepGen(l.drill, i));
    startSession({ kind: 'lesson', id, title: T(l.title), eyebrow: 'Stufe ' + l.stage + ' · Lektion', steps });
  }
  function viewDrill(id) {
    if (id === 'taktik') {
      const d = curDay(), t = d && d.tasks.find((x, i) => x[0] === 't' && !taskDone(d, i));
      return startSession({ kind: 'tactics', title: 'Taktik-Aufgaben', steps: tacticPool(t ? t[1] : 6).map(stepTactic) });
    }
    startSession({ kind: 'drill', id, title: dTitle(id), steps: Array.from({ length: 10 }, (_, i) => stepGen(id, i)) });
  }
  function viewReview() {
    const steps = reviewSteps(10);
    if (!steps.length) {
      screen('<div class="page"><a class="back" href="' + lastMain + '">← Zurück</a><div class="qcard"><h2>Noch nichts zu wiederholen</h2><p>Sobald du die erste Lektion abgeschlossen hast, sammelt die App hier deine Aufgaben – Fehler zuerst.</p><a class="btn" href="#lernen">Zum Lernpfad</a></div></div>');
      $('#app').classList.remove('fullscreen');
      return;
    }
    startSession({ kind: 'review', title: 'Wiederholung', steps });
  }
  function viewExam(n) {
    const cur = curDay();
    const inPlan = !cur || cur.tasks.some((t) => t[0] === 'x' && t[1] === n) || cur.stage > n;
    startSession({ kind: 'exam', id: n, title: n < 5 ? 'Stufentest ' + n : 'Abschlussprüfung', steps: examSteps(n), skip: !inPlan });
  }
  function curStep() {
    const st = S.steps[S.i];
    if (st.t === 'q' && !st.q) st.q = D.DRILLS[st.gen].gen({ i: st.gi, adv: knows('grandnull') });
    return st;
  }
  function settle(score, extra) {
    const st = S.steps[S.i];
    S.ans = Object.assign({ score }, extra || {});
    if (!st.again) {
      S.n++; S.sum += score;
      (S.res[st.key] = S.res[st.key] || []).push(score);
      if (st.quiz && score >= 1) S.quizOk++;
    }
    if (score >= 1) { S.combo++; if (st.tactic && !P.tactics[st.tactic]) { P.tactics[st.tactic] = true; save(); } }
    else { S.combo = 0; if (score < 0.5 && (st.rep || 0) < 2) S.steps.push(Object.assign({}, st, { again: true, rep: (st.rep || 0) + 1 })); }
    beep(score > 0 ? 'ok' : 'no');
    renderSession();
  }
  function sessNext() {
    S.i++; S.ans = null; S.sel = []; S.seqAt = 0;
    if (S.i >= S.steps.length) { S.done = true; finishSession(); }
    renderSession();
  }
  function finishSession() {
    const t = today();
    const score = S.n ? Math.round(S.sum / S.n * 100) : 100;
    const o = { score, pass: true, secs: Math.round((Date.now() - S.t0) / 1000) };
    for (const k in S.res) {
      const r = S.res[k], avg = r.reduce((a, b) => a + b, 0) / r.length;
      PL.srsUpdate(P.srs, k, k[0] === 'd' ? avg >= 0.8 : avg >= 1, t);
    }
    let xp = 10 + Math.round(S.sum);
    if (S.kind === 'lesson') { const prev = P.lessons[S.id]; P.lessons[S.id] = { done: true, quiz: Math.max(S.quizOk, prev ? prev.quiz || 0 : 0) }; }
    if (S.kind === 'drill') {
      const d = P.drills[S.id] || { best: 0, sessions: 0 };
      o.record = score > d.best && d.sessions > 0;
      d.best = Math.max(d.best, score); d.last = score; d.sessions++;
      P.drills[S.id] = d;
      o.pass = score >= 80;
      o.enough = !o.pass && drillBest(S.id) < 80 && drillEnough(S.id);
    }
    if (S.kind === 'exam') {
      const e = P.exams[S.id] || { best: 0, passed: false };
      e.best = Math.max(e.best, score);
      o.pass = score >= 80;
      if (o.pass) { if (!e.passed) xp += 20; e.passed = true; if (S.skip) { for (let s = 1; s <= S.id; s++) P.plan.skip[s] = true; o.skipped = true; } }
      P.exams[S.id] = e;
    }
    if (S.kind === 'review') planFlag('r');
    if (S.kind === 'tactics') planFlag('t');
    if (S.n >= 3 && S.sum === S.n) { xp += 5; P.perfect++; o.perfect = true; }
    o.xp = xp;
    o.streakInc = award(xp);
    o.days = syncPlan();
    o.ach = checkAch();
    S.out = o;
    beep(o.pass ? 'win' : 'no');
  }
  function renderSummary() {
    const o = S.out;
    const head = {
      lesson: 'Lektion geschafft!', review: 'Wiederholung geschafft!', tactics: 'Taktik trainiert!',
      drill: o.pass ? 'Übung bestanden!' : 'Fast – noch eine Runde',
      exam: o.pass ? (S.id === 5 ? 'Prüfung bestanden!' : 'Stufentest bestanden!') : 'Noch nicht bestanden',
    }[S.kind];
    let sub = o.perfect ? 'Ohne einen einzigen Fehler.' : '';
    if (S.kind === 'drill' && !o.pass) sub = 'Du hattest ' + o.score + ' % beim ersten Versuch, 80 % brauchst du. Die nächste Runde bringt neue Aufgaben.';
    if (S.kind === 'drill' && o.pass && o.record) sub = 'Neuer Bestwert!';
    if (o.enough) sub = 'Du hattest ' + o.score + '\u00a0%. Für den Plan reicht dein Bestwert von ' + drillBest(S.id) + '\u00a0% – die Übung kommt in der Wiederholung wieder, bis sie sitzt.';
    if (S.kind === 'exam' && !o.pass) sub = 'Du hattest ' + o.score + ' %, 80 % brauchst du. Wiederhole die Übungen dieser Stufe und versuch es noch einmal.';
    if (o.skipped) sub = 'Du überspringst alles bis einschließlich Stufe ' + S.id + '.';
    if (S.kind === 'lesson' && !sub) sub = 'Das Gelernte kommt in den nächsten Tagen in der Wiederholung wieder.';
    const mm = Math.floor(o.secs / 60) + ':' + String(o.secs % 60).padStart(2, '0');
    let h = '<div class="sess sum' + (o.pass ? '' : ' fail') + '"><div class="sbody"><div class="sin sumin"><div class="burst">' + (o.pass ? ICON.check : ICON.repeat) + '</div><div class="eyebrow">' + esc(S.title) + '</div><h1>' + head + '</h1>' + (sub ? '<p class="sumsub">' + sub + '</p>' : '');
    h += '<div class="tiles"><div class="tile xp"><span>Erfahrung</span><b>+' + o.xp + ' XP</b></div><div class="tile acc"><span>Genauigkeit</span><b>' + o.score + ' %</b></div><div class="tile time"><span>Zeit</span><b>' + mm + '</b></div></div>';
    const lines = [];
    if (o.streakInc) lines.push('<div class="sline fire">' + ICON.flame + '<span><b>' + P.streak.n + (P.streak.n === 1 ? ' Tag' : ' Tage') + ' in Folge</b>' + (P.streak.n === 1 ? 'Deine Serie beginnt. Komm morgen wieder!' : 'Deine Serie wächst.') + '</span></div>');
    for (const d of o.days) lines.push('<div class="sline day">' + ICON.check + '<span><b>Tag ' + d.n + ' geschafft</b>' + esc(d.title) + ' – Tagesziel erreicht.</span></div>');
    for (const a of o.ach) lines.push('<div class="sline ach">' + ICON.trophy + '<span><b>Erfolg: ' + a.t + '</b>' + a.d + '</span></div>');
    h += lines.join('') + '</div></div><footer class="sfoot">';
    const cur = curDay();
    const nx = cur && !o.days.length ? cur.tasks.map((_, i) => taskInfo(cur, i)).find((x) => !x.done) : null;
    if (!o.pass && !o.enough) h += '<button class="btn big" id="again">Noch eine Runde</button><a class="btn soft" href="' + S.back + '">Später</a>';
    else if (nx) h += '<a class="btn big" id="snextask" href="' + nx.href + '">Weiter: ' + esc(nx.short) + '</a><a class="btn soft" href="#lernen">Zum Lernpfad</a>';
    else h += '<a class="btn big" id="snextask" href="#lernen">' + (o.days.length ? 'Fertig für heute' : 'Zum Lernpfad') + '</a>' + (S.kind === 'drill' || S.kind === 'tactics' || S.kind === 'review' ? '<button class="btn soft" id="again">Noch eine Runde</button>' : '');

    const ag = $('#again');
    if (ag) ag.onclick = () => route();
    const na = $('#snextask');
    // gleiche Adresse (z. B. zwei Spiele-Aufgaben hintereinander) lädt sonst nicht neu
    if (na) na.onclick = (ev) => { if (na.getAttribute('href') === location.hash) { ev.preventDefault(); route(); } };
  }
  function questionHTML(st, q, ans) {
    let h = '<div class="qhead">' + (st.again ? '<span class="again">' + ICON.repeat + 'Noch einmal</span>' : '<span class="eyebrow">' + esc(q.title ? T(q.title) : st.gen ? dTitle(st.gen) : 'Kurze Frage') + '</span>') + '</div>';
    if (q.kind === 'seq' && S.seqAt < q.steps.length) {
      const s = q.steps[S.seqAt];
      return h + '<div class="qtext">Merke dir die Augen. Stich ' + (S.seqAt + 1) + ' von ' + q.steps.length + ':</div><div class="minitrick">' + s.cards.map((c) => '<figure>' + cardHTML(c) + '</figure>').join('') + '</div><p style="text-align:center"><b>→ ' + s.won + '</b></p>';
    }
    const how = S.kind !== 'exam' && (q.how || (st.gen && D.DRILLS[st.gen].how));
    if (how && !ans) h += '<details class="how"' + (st.gen && st.gi < 2 && !st.again && S.kind !== 'review' ? ' open' : '') + '><summary>So gehst du vor</summary>' + rich(how, { terms: false }) + '</details>';
    if (q.tricksShown) h += '<div class="tricklist' + (q.tricksBy ? ' named' : '') + '">' + q.tricksShown.map((t, i) => '<div class="tl"><span class="tn">' + (i + 1) + '.</span>' + t.map((c, k) => (q.tricksBy ? '<span class="tc">' + cardHTML(c) + '<small>' + q.tricksBy[i][k] + '</small></span>' : cardHTML(c))).join('') + '</div>').join('') + '</div>';
    h += '<div class="qtext">' + rich(q.text) + '</div>';
    if (q.trick) h += '<div class="minitrick">' + q.trick.map((x) => '<figure>' + cardHTML(x.c) + '<figcaption>' + esc(x.who) + '</figcaption></figure>').join('') + '<figure><div class="card ghostcard"></div><figcaption>Du</figcaption></figure></div>';
    if (q.kind === 'choice' || q.kind === 'seq') {
      if (q.hand && q.kind === 'choice') h += '<div class="eyebrow">Deine Karten</div><div class="pickhand" style="--cw:40px">' + q.hand.map((c) => cardHTML(c)).join('') + '</div>';
      h += '<div class="opts">' + q.options.map((o, i) => {
        let cls = 'opt';
        if (ans) { if (i === q.answer) cls += ' right'; else if (i === ans.i) cls += ' wrong'; }
        return '<button class="' + cls + '" data-i="' + i + '"' + (ans ? ' disabled' : '') + '>' + rich(o, { terms: false }) + '</button>';
      }).join('') + '</div>';
    } else if (q.kind === 'trick') {
      h += '<div class="minitrick">' + q.cards.map((c, i) => {
        let cls = 'tap';
        if (ans) { if (i === q.answer) cls += ' good'; else if (i === ans.i) cls += ' badpick'; }
        return '<figure>' + cardHTML(c, { button: !ans, cls }) + '<figcaption>' + (i === 0 ? 'ausgespielt' : i + 1 + '. Karte') + '</figcaption></figure>';
      }).join('') + '</div>';
    } else if (q.kind === 'pick') {
      h += '<div class="pickhand">' + q.hand.map((c) => {
        let cls = '';
        if (!ans && S.sel.includes(c)) cls = 'sel';
        if (q.legal && !q.legal.includes(c) && !ans) cls += ' dim';
        if (q.mark && E.isTrump(c, q.gt)) cls += ' trumpmark';
        if (ans) { if (q.answer.includes(c)) cls = 'good'; else if (S.sel.includes(c)) cls = 'badpick'; }
        return cardHTML(c, { button: !ans, cls });
      }).join('') + '</div>';
    }
    return h;

  function renderSession() {
    if (S.done) return renderSummary();

    const seqMid = q && q.kind === 'seq' && S.seqAt < q.steps.length;

    h += '<div class="sbody" id="sbody"><div class="sin" id="qcard">';

    else if (ans) {

      h += '<footer class="sfoot fb ' + cls + '"><div class="fbh">' + (cls === 'no' ? ICON.cross : ICON.check) + '<b>' + (cls === 'ok' ? (S.combo >= 3 ? S.combo + ' in Folge!' : praise) : cls === 'mid' ? 'Fast.' : 'Nicht ganz.') + '</b></div><div class="fbt">' + rich(ans.msg || q.explain) + (cls === 'no' && !st.again && (st.rep || 0) < 2 ? '<p class="note">Die Aufgabe kommt am Ende noch einmal.</p>' : '') + '</div><button class="btn big" id="snext">Weiter</button></footer>';
    } else if (q.kind === 'pick' && q.multi) {
      const need = q.count || 0;
      h += '<footer class="sfoot"><button class="btn big" id="check"' + ((need ? S.sel.length !== need : !S.sel.length) ? ' disabled' : '') + '>' + (need ? 'Diese ' + need + ' drücken' : 'Prüfen') + '</button></footer>';
    }
    h += '</div>';
    const keep = $('#sbody') && S.keepScroll ? $('#sbody').scrollTop : 0;

    const nb = $('#snext');
    if (nb) nb.onclick = () => { if (seqMid) { S.seqAt++; renderSession(); } else sessNext(); };
    if (st.t === 'info' || ans || seqMid) return;
    const qc = $('#qcard');
    const answer = (score, extra) => { S.keepScroll = true; settle(score, extra); };
    if (q.kind === 'choice' || q.kind === 'seq') qc.querySelectorAll('.opt').forEach((b) => (b.onclick = () => {
      const i = Number(b.dataset.i);
      answer(i === q.answer ? 1 : q.near && q.near(i) ? 0.5 : 0, { i });
    }));
    if (q.kind === 'trick') qc.querySelectorAll('.minitrick .card').forEach((b, i) => (b.onclick = () => answer(i === q.answer ? 1 : 0, { i })));
    if (q.kind === 'pick') qc.querySelectorAll('.pickhand .card').forEach((b) => (b.onclick = () => {
      const c = Number(b.dataset.c);
      if (q.legal && !q.legal.includes(c)) return toast('Diese Karte darfst du nicht legen – du musst bedienen.');
      if (!q.multi) { S.sel = [c]; return answer(q.answer.includes(c) ? 1 : 0); }
      if (S.sel.includes(c)) S.sel = S.sel.filter((x) => x !== c);
