<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skat lernen</title>
<meta name="description" content="Skat lernen vom Einsteiger zum ernstzunehmenden Spieler: Lektionen, Übungen und Übungsspiele gegen den Computer.">
<meta name="theme-color" content="#1c5a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skat">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Young+Serif&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: Lernpfad wie ein Skatblock (linierte Zeilen, Wertungsspalte rechts); Spieltisch als Filz in voller Höhe. */
:root {
  --paper: #f2f5f3;
  --paper-2: #ffffff;
  --ink: #15211c;
  --muted: #5a6a63;
  --rule: #d6e0db;
  --felt: #1c5a45;
  --felt-hi: #24705a;
  --felt-ink: #eaf3ee;
  --brass: #b8861c;
  --brass-soft: #f3e6c4;
  --accent: #1c5a45;
  --accent-ink: #ffffff;
  --ok: #24804f;
  --ok-soft: #dcefe3;
  --bad: #b6352c;
  --bad-soft: #f6e0dd;
  --card-bg: #fffefb;
  --card-edge: #d9d6cc;
  --back-a: #7c2230;
  --back-b: #5e1824;
  --kreuz: #1d1d1b;
  --pik: #19803a;
  --herz: #d0262d;
  --karo: #e07d00;
  --shadow: 0 1px 2px rgba(20, 35, 28, .08), 0 4px 14px rgba(20, 35, 28, .08);
  --font-display: 'Young Serif', 'Iowan Old Style', Georgia, serif;
  --font-body: 'Source Sans 3', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 14px;
  --tab-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1714; --paper-2: #16211c; --ink: #e4ece7; --muted: #93a59c; --rule: #26352e;
    --felt: #103b2e; --felt-hi: #175140; --felt-ink: #e4efe9; --brass: #d6a53c; --brass-soft: #3a3020;
    --accent: #3d9c78; --accent-ink: #06130e; --ok: #4cbc7e; --ok-soft: #173426; --bad: #e06a5f; --bad-soft: #3a1d1a;
    --card-bg: #f1efe8; --card-edge: #b9b5a8; --back-a: #6c1d29; --back-b: #4b121c;
    --kreuz: #1d1d1b; --pik: #157034; --herz: #c42229; --karo: #cf7000;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1714; --paper-2: #16211c; --ink: #e4ece7; --muted: #93a59c; --rule: #26352e;
  --felt: #103b2e; --felt-hi: #175140; --felt-ink: #e4efe9; --brass: #d6a53c; --brass-soft: #3a3020;
  --accent: #3d9c78; --accent-ink: #06130e; --ok: #4cbc7e; --ok-soft: #173426; --bad: #e06a5f; --bad-soft: #3a1d1a;
  --card-bg: #f1efe8; --card-edge: #b9b5a8; --back-a: #6c1d29; --back-b: #4b121c;
  --kreuz: #1d1d1b; --pik: #157034; --herz: #c42229; --karo: #cf7000;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

html, body { height: 100%; }
body.felt { background: var(--felt); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.page { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; display: flex; flex-direction: column; gap: 18px; }

/* Tab-Leiste */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--paper-2); border-top: 1px solid var(--rule); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: var(--tab-h); text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.tabbar a svg { width: 24px; height: 24px; }
.tabbar a.on { color: var(--accent); }
.app.fullscreen .tabbar { display: none; }

/* Kopf */
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 30px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: none; }

/* Stufenanzeige */
.levelcard { background: var(--felt); color: var(--felt-ink); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.levelcard::after { content: ""; position: absolute; right: -18px; top: -26px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.10), transparent 70%); }
.levelcard .lv { display: flex; align-items: center; gap: 12px; }
.levelcard .num { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--brass); display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; color: var(--brass); flex: none; }
.levelcard h2 { font-size: 22px; }
.levelcard .sub { font-size: 14px; opacity: .85; }
.ladder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.ladder span { height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); }
.ladder span.on { background: var(--brass); }
.ladder span.part { background: linear-gradient(90deg, var(--brass) var(--p), rgba(255,255,255,.18) var(--p)); }

/* Skatblock-Liste */
.block { background: var(--paper-2); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.block-h { padding: 14px 16px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 2px solid var(--ink); }
.block-h h3 { font-size: 19px; }
.block-h .eyebrow { white-space: nowrap; }
.row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--rule); text-decoration: none; min-height: 52px; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row .t { font-weight: 600; }
.row .d { font-size: 13px; color: var(--muted); }
.row .mark { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--rule); display: grid; place-items: center; font-size: 13px; color: var(--accent-ink); }
.row .mark.done { background: var(--ok); border-color: var(--ok); }
.row .mark.part { border-color: var(--brass); }
.row .score { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; padding-left: 12px; border-left: 1px solid var(--rule); min-width: 52px; text-align: right; color: var(--muted); }
.row .score.good { color: var(--ok); }
.row.locked { opacity: .55; }

.nextup { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--brass-soft); border-radius: var(--r); padding: 14px 16px; text-decoration: none; }
.nextup .t { font-family: var(--font-display); font-size: 19px; }
.nextup .d { font-size: 14px; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.btn.soft { background: var(--paper-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.btn.brass { background: var(--brass); color: #1c1405; }
.btn.small { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 140px; }

/* Lektion */
.lesson { display: flex; flex-direction: column; gap: 14px; }
.lesson h1 { font-size: 28px; }
.lpage { background: var(--paper-2); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); font-size: 17px; line-height: 1.55; max-width: 65ch; }
.lpage.new { animation: rise .35s ease both; }
.lpage b { font-weight: 700; }
.lpage .formula { font-family: var(--font-display); font-size: 22px; text-align: center; padding: 8px 0; }
table.pts { border-collapse: collapse; margin: 8px 0; font-variant-numeric: tabular-nums; }
table.pts td { padding: 3px 14px 3px 0; border-bottom: 1px solid var(--rule); }
table.pts td:last-child { font-weight: 700; text-align: right; }
.steps { display: flex; gap: 5px; }
.steps span { flex: 1; height: 4px; border-radius: 2px; background: var(--rule); }
.steps span.on { background: var(--accent); }
@keyframes rise { from { transform: translateY(8px); opacity: .0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Karten */
.card { --w: var(--cw, 62px); width: var(--w); height: calc(var(--w) * 1.42); border-radius: calc(var(--w) * .11); background: var(--card-bg); border: 1px solid var(--card-edge); box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 3px 8px rgba(0,0,0,.18); position: relative; color: var(--sc); flex: none; user-select: none; -webkit-user-select: none; padding: 0; font-family: var(--font-body); }
.card .ix { position: absolute; left: 6%; top: 4%; display: flex; flex-direction: column; align-items: center; line-height: .92; font-weight: 700; font-size: calc(var(--w) * .28); letter-spacing: -.03em; }
.card .ix i { font-style: normal; font-size: calc(var(--w) * .25); }
.card .pip { position: absolute; left: 22%; right: 6%; top: 18%; bottom: 8%; display: grid; place-items: center; font-size: calc(var(--w) * .58); line-height: 1; }
.card .pip.face { font-family: var(--font-display); font-size: calc(var(--w) * .5); }
.card .pip.face small { display: block; font-family: var(--font-body); font-size: .5em; text-align: center; margin-top: 2px; }
.card .pip.face span { display: grid; justify-items: center; }
.card.jack .pip.face { color: var(--sc); }
.card.jack::after { content: ""; position: absolute; inset: 3px; border-radius: calc(var(--w) * .08); border: 1.5px solid color-mix(in srgb, var(--sc) 35%, transparent); pointer-events: none; }
.s0 { --sc: var(--karo); } .s1 { --sc: var(--herz); } .s2 { --sc: var(--pik); } .s3 { --sc: var(--kreuz); }
/* deutsches Blatt: Farbzeichen als SVG */
.deck-de .s0 { --sc: #a86300; } .deck-de .s1 { --sc: #c42229; } .deck-de .s2 { --sc: #2c7a2c; } .deck-de .s3 { --sc: #5b391b; }
.si { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex: none; }
.card .ix i .si { display: block; margin-top: 2px; width: .95em; height: .95em; }
.card .pip > .si { width: .92em; height: .92em; display: block; }
.card .pip.face small .si { width: 1.05em; height: 1.05em; display: inline-block; vertical-align: top; }
.chip .si { width: .95em; height: .95em; margin-right: 1px; align-self: center; }
.gn .si { width: 1.1em; height: 1.1em; }
.card.back { background: repeating-linear-gradient(45deg, var(--back-a) 0 6px, var(--back-b) 6px 12px); border: 3px solid var(--card-bg); }
.card.trumpmark::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; border-radius: 0 0 calc(var(--w) * .1) calc(var(--w) * .1); background: var(--brass); opacity: .85; }
.crow { display: flex; flex-wrap: wrap; gap: 6px; --cw: 42px; margin: 10px 0 4px; }
.crow .card .ix { font-size: calc(var(--w) * .32); }
.chip { display: inline-flex; align-items: baseline; gap: 1px; padding: 0 .32em; margin: 0 .05em; border-radius: 5px; background: var(--card-bg); color: var(--sc); border: 1px solid var(--card-edge); font-weight: 700; line-height: 1.35; white-space: nowrap; font-size: .95em; }

/* Übung */
.qcard { background: var(--paper-2); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.qtext { font-size: 17px; }
.qtext .game, .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--felt); color: var(--felt-ink); padding: 2px 8px; border-radius: 6px; margin-right: 6px; vertical-align: 2px; }
.opts { display: grid; gap: 10px; }
.opt { min-height: 52px; border-radius: 12px; border: 0; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--rule); padding: 10px 14px; text-align: left; font-size: 17px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.opt.right { box-shadow: inset 0 0 0 2px var(--ok); background: var(--ok-soft); }
.opt.wrong { box-shadow: inset 0 0 0 2px var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.feedback { border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.5; animation: rise .25s ease both; }
.feedback.ok { background: var(--ok-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback.mid { background: var(--brass-soft); }
.feedback b.h { display: block; font-size: 16px; margin-bottom: 2px; }
.feedback ul { margin: 6px 0; padding-left: 18px; }
.note { font-size: 13px; color: var(--muted); }
.pickhand { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; --cw: 58px; }
.pickhand .card { cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
.pickhand .card.sel { transform: translateY(-10px); box-shadow: 0 0 0 3px var(--brass), 0 6px 14px rgba(0,0,0,.25); }
.pickhand .card.good { box-shadow: 0 0 0 3px var(--ok); }
.pickhand .card.badpick { box-shadow: 0 0 0 3px var(--bad); }
.pickhand .card.dim { filter: saturate(.3) brightness(.85); }
.minitrick { display: flex; gap: 10px; justify-content: center; align-items: flex-end; --cw: 54px; padding: 12px; background: var(--felt); border-radius: 12px; flex-wrap: wrap; }
.minitrick figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--felt-ink); font-size: 12px; font-weight: 600; }
.minitrick .card.tap { cursor: pointer; }
.minitrick .card.good { box-shadow: 0 0 0 3px var(--ok); }
.minitrick .card.badpick { box-shadow: 0 0 0 3px var(--bad); }
.tricklist { display: grid; gap: 6px; --cw: 34px; }
.tricklist .tl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.tricklist .tl .card .ix { font-size: calc(var(--w) * .36); }
.dots { display: flex; gap: 6px; }
.dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--rule); }
.dots span.ok { background: var(--ok); } .dots span.no { background: var(--bad); } .dots span.cur { background: var(--brass); }
.result-big { font-family: var(--font-display); font-size: 48px; line-height: 1; }

/* Spieltisch */
.table { position: relative; height: 100%; display: flex; flex-direction: column; background: radial-gradient(ellipse 120% 70% at 50% 38%, var(--felt-hi), var(--felt) 70%); color: var(--felt-ink); overflow: hidden; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 4px; }
.tbar button, .tbar a { background: rgba(255,255,255,.1); border: 0; color: var(--felt-ink); height: 36px; padding: 0 12px; border-radius: 10px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; cursor: pointer; }
.tbar .ttl { font-size: 13px; opacity: .8; text-align: center; flex: 1; font-variant-numeric: tabular-nums; }
.opps { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 12px; }
.opp { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.opp.r { align-items: flex-end; text-align: right; }
.opp .who { display: flex; align-items: center; gap: 8px; }
.opp.r .who { flex-direction: row-reverse; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 18px; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.25); flex: none; }
.opp.turn .avatar, .me.turn .avatar { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(214,165,60,.35); }
.opp .nm { font-weight: 700; font-size: 15px; line-height: 1.1; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; }
.opp.r .badges { justify-content: flex-end; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.14); white-space: nowrap; }
.badge.decl { background: var(--brass); color: #1c1405; }
.backs { display: flex; height: 26px; --cw: 18px; }
.opp.r .backs { flex-direction: row-reverse; }
.backs .card { margin-left: -12px; box-shadow: none; border-width: 2px; }
.opp.r .backs .card { margin-left: 0; margin-right: -12px; }
.backs .card:first-child { margin-left: 0; margin-right: 0; }
.bubble { align-self: flex-start; background: var(--card-bg); color: #1d1d1b; font-weight: 700; padding: 3px 10px; border-radius: 12px; font-size: 14px; }
.opp.r .bubble { align-self: flex-end; }
.openhand { display: flex; flex-wrap: wrap; gap: 3px; max-width: 100%; }
.opp.r .openhand { justify-content: flex-end; }
.center { flex: 1; min-height: 150px; position: relative; display: flex; align-items: center; justify-content: center; }
.trick { position: relative; width: 230px; height: 170px; --cw: min(19vw, 76px); }
.trick .slot { position: absolute; transition: transform .25s ease, opacity .25s ease; }
.trick .slot.p1 { left: 8px; top: 6px; transform: rotate(-8deg); }
.trick .slot.p2 { right: 8px; top: 6px; transform: rotate(8deg); }
.trick .slot.p0 { left: 50%; bottom: 0; margin-left: calc(var(--cw) / -2); }
.trick.collect .slot { opacity: .0; }
.trick.collect.to0 .slot { transform: translateY(80px) scale(.6); }
.trick.collect.to1 .slot { transform: translate(-120px, -60px) scale(.6); }
.trick.collect.to2 .slot { transform: translate(120px, -60px) scale(.6); }
.skatpile { display: flex; gap: 6px; --cw: 52px; }
.msg { flex: none; min-height: 44px; padding: 6px 14px; text-align: center; font-size: 15px; line-height: 1.35; display: flex; align-items: center; justify-content: center; }
.msg .coach { background: var(--card-bg); color: #1d1d1b; border-radius: 12px; padding: 8px 12px; font-size: 14px; text-align: left; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.msg .coach b { color: var(--felt); }
.infobar { flex: none; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 2px 12px 6px; font-size: 13px; font-variant-numeric: tabular-nums; }
.infobar span { background: rgba(0,0,0,.18); padding: 2px 9px; border-radius: 8px; }
.actions { flex: none; display: flex; gap: 8px; justify-content: center; padding: 0 12px 8px; flex-wrap: wrap; }
.actions .btn { min-height: 40px; font-size: 15px; padding: 0 14px; }
.tbtn { background: rgba(255,255,255,.12); color: var(--felt-ink); }
.table.haspanel .center { min-height: 0; }
.panel { flex: none; margin: 0 12px 8px; background: var(--paper-2); color: var(--ink); border-radius: 16px; padding: 12px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 10px; max-height: 46vh; overflow-y: auto; }
.panel h3 { font-size: 18px; }
.panel .advice { font-size: 14px; background: var(--brass-soft); border-radius: 10px; padding: 8px 10px; }
.panel .advice ul { margin: 4px 0 0; padding-left: 18px; }
.gamegrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

<body>
<div id="app" class="app">
  <main id="screen" class="screen"></main>
  <nav class="tabbar" aria-label="Bereiche">
    <a href="#lernen" data-tab="lernen"><span>Lernen</span></a>
    <a href="#ueben" data-tab="ueben"><span>Üben</span></a>
    <a href="#spielen" data-tab="spielen"><span>Spielen</span></a>
    <a href="#fortschritt" data-tab="fortschritt"><span>Fortschritt</span></a>
  </nav>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* Skat-Regelwerk nach Internationaler Skatordnung (ISkO).
 * Karten: id = farbe * 8 + rang
 *   farbe: 0 Karo, 1 Herz, 2 Pik, 3 Kreuz
 *   rang:  0 7, 1 8, 2 9, 3 Dame, 4 König, 5 Zehn, 6 Ass, 7 Bube
 * Spielart (gt): 0-3 Farbspiel (Trumpffarbe), 4 Grand, 5 Null
 */
(function (G) {
  'use strict';

  const SUIT_NAMES = ['Karo', 'Herz', 'Pik', 'Kreuz'];
  const SUIT_SYM = ['♦', '♥', '♠', '♣'];
  const RANK_SHORT = ['7', '8', '9', 'D', 'K', '10', 'A', 'B'];
  const RANK_NAMES = ['Sieben', 'Acht', 'Neun', 'Dame', 'König', 'Zehn', 'Ass', 'Bube'];
  const POINTS = [0, 0, 0, 3, 4, 10, 11, 2];
  // Rangfolge im Nullspiel: 7 8 9 10 B D K A
  const NULL_STR = [0, 1, 2, 5, 6, 3, 7, 4];
  const GT_GRAND = 4, GT_NULL = 5;
  const GAME_NAMES = ['Karo', 'Herz', 'Pik', 'Kreuz', 'Grand', 'Null'];
  const BASE = [9, 10, 11, 12, 24];
  const JACKS = [31, 23, 15, 7]; // Kreuz-, Pik-, Herz-, Karo-Bube

  // Kartenbild: französisch (Kreuz, Pik, Herz, Karo) oder deutsch (Eichel, Grün, Rot, Schellen)
  const DECKS = {
    fr: { suits: ['Karo', 'Herz', 'Pik', 'Kreuz'], ranks: ['Sieben', 'Acht', 'Neun', 'Dame', 'König', 'Zehn', 'Ass', 'Bube'], short: ['7', '8', '9', 'D', 'K', '10', 'A', 'B'] },
    de: { suits: ['Schellen', 'Rot', 'Grün', 'Eichel'], ranks: ['Sieben', 'Acht', 'Neun', 'Ober', 'König', 'Zehn', 'Ass', 'Unter'], short: ['7', '8', '9', 'O', 'K', '10', 'A', 'U'] },
  };
  let DECK = 'fr';
  function setDeck(id) {
    const d = DECKS[id] ? id : 'fr';
    DECK = d;
    const x = DECKS[d];
    for (let i = 0; i < 4; i++) { SUIT_NAMES[i] = x.suits[i]; GAME_NAMES[i] = x.suits[i]; }
    for (let i = 0; i < 8; i++) { RANK_NAMES[i] = x.ranks[i]; RANK_SHORT[i] = x.short[i]; }
    return d;
  }
  const deck = () => DECK;

  const suitOf = (c) => c >> 3;
  const rankOf = (c) => c & 7;
  const pts = (c) => POINTS[c & 7];
  const card = (s, r) => s * 8 + r;
  const sumPts = (cards) => cards.reduce((a, c) => a + POINTS[c & 7], 0);

  function cardName(c) {
    return SUIT_NAMES[suitOf(c)] + '-' + RANK_NAMES[rankOf(c)];
  }
  function cardShort(c) {
    return SUIT_SYM[suitOf(c)] + RANK_SHORT[rankOf(c)];
  }

  function isTrump(c, gt) {
    if (gt === GT_NULL) return false;
    if ((c & 7) === 7) return true;
    return gt < 4 && (c >> 3) === gt;
  }
  // effektive Farbe: 4 = Trumpf
  function effSuit(c, gt) {
    return isTrump(c, gt) ? 4 : c >> 3;
  }
  // Stärke innerhalb der effektiven Farbe
  function strength(c, gt) {
    const r = c & 7;
    if (gt === GT_NULL) return NULL_STR[r];
    if (r === 7) return 20 + (c >> 3);
    return r;
  }
  // Schlägt Karte a die bisher beste Karte b (b gehört zur Ausspielfarbe oder ist Trumpf)?
  function beats(a, b, gt) {
    const ea = effSuit(a, gt), eb = effSuit(b, gt);
    if (ea === eb) return strength(a, gt) > strength(b, gt);
    return ea === 4;
  }
  function trickWinnerIndex(cards, gt) {
    let best = 0;
    for (let i = 1; i < cards.length; i++) if (beats(cards[i], cards[best], gt)) best = i;
    return best;
  }
  function legalCards(hand, trickCards, gt) {
    if (!trickCards.length) return hand.slice();
    const le = effSuit(trickCards[0], gt);
    const f = hand.filter((c) => effSuit(c, gt) === le);
    return f.length ? f : hand.slice();
  }

  // Sortierung für die Handanzeige
  function sortHand(hand, gt) {
    const g = gt == null ? 3 : gt;
    const suitRank = (s) => {
      // Farben abwechselnd schwarz/rot: Kreuz, Herz, Pik, Karo
      const order = [3, 1, 2, 0];
      return order.indexOf(s);
    };
    return hand.slice().sort((a, b) => {
      const ea = effSuit(a, g), eb = effSuit(b, g);
      if (ea !== eb) {
        if (ea === 4) return -1;
        if (eb === 4) return 1;
        return suitRank(ea) - suitRank(eb);
      }
      return strength(b, g) - strength(a, g);
    });
  }

  // Spitzen (Matadore): {mit: bool, n}
  function matadorOrder(gt) {
    if (gt === GT_GRAND) return JACKS.slice();
    return JACKS.concat([6, 5, 4, 3, 2, 1, 0].map((r) => card(gt, r)));
  }
  function spitzen(cards, gt) {
    if (gt === GT_NULL) return { mit: false, n: 0 };
    const order = matadorOrder(gt);
    const set = new Set(cards);
    const mit = set.has(order[0]);
    let n = 0;
    for (const c of order) {
      if (set.has(c) === mit) n++;
      else break;
    }
    return { mit, n };
  }

  function nullValue(hand, ouvert) {
    if (ouvert) return hand ? 59 : 46;
    return hand ? 35 : 23;
  }

  // Stufen für ein Farb-/Grandspiel
  function levelsFor(p) {
    const sAng = !!(p.schneiderAng || p.schwarzAng || p.ouvert);
    const swAng = !!(p.schwarzAng || p.ouvert);
    const items = [];
    items.push({ label: (p.mit ? 'mit ' : 'ohne ') + p.n, v: p.n });
    items.push({ label: 'Spiel', v: 1 });
    if (p.hand) items.push({ label: 'Hand', v: 1 });
    if (p.schneider || sAng) items.push({ label: 'Schneider', v: 1 });
    if (sAng) items.push({ label: 'Schneider angesagt', v: 1 });
    if (p.schwarz || swAng) items.push({ label: 'Schwarz', v: 1 });
    if (swAng) items.push({ label: 'Schwarz angesagt', v: 1 });
    if (p.ouvert) items.push({ label: 'Ouvert', v: 1 });
    return items;
  }

  // Wert eines angesagten Spiels vor dem Ausspielen (ohne Schneider/Schwarz-Ergebnis)
  function announcedValue(gt, cards12, opts) {
    if (gt === GT_NULL) return nullValue(opts.hand, opts.ouvert);
    const sp = spitzen(cards12, gt);
    const items = levelsFor({ ...sp, hand: opts.hand, schneiderAng: opts.schneiderAng, schwarzAng: opts.schwarzAng, ouvert: opts.ouvert });
    return items.reduce((a, i) => a + i.v, 0) * BASE[gt];
  }

  // Alle möglichen Reizwerte
  const BID_VALUES = (() => {
    const s = new Set([23, 35, 46, 59]);
    for (const b of [9, 10, 11, 12]) for (let l = 2; l <= 18; l++) s.add(b * l);
    for (let l = 2; l <= 11; l++) s.add(24 * l);
    return [...s].filter((v) => v >= 18).sort((a, b) => a - b);
  })();
  function nextBid(v) {
    for (const b of BID_VALUES) if (b > v) return b;
    return null;
  }

  function gameLabel(game) {
    if (!game) return '';
    let s = GAME_NAMES[game.gt];
    if (game.gt === GT_NULL) {
      if (game.ouvert) s += ' ouvert';
      if (game.hand) s += ' Hand';
      return s;
    }
    if (game.hand) s += ' Hand';
    if (game.ouvert) s += ' ouvert';
    else if (game.schwarzAng) s += ', Schwarz angesagt';
    else if (game.schneiderAng) s += ', Schneider angesagt';
    return s;
  }

  // ---------- Ergebnis ----------
  // st: {declarer, bid, game:{gt,hand,schneiderAng,schwarzAng,ouvert}, declCards12, tricks:[{winner, cards:[{p,c}]}], skatPts}
  function evaluate(st) {
    const g = st.game;
    const gt = g.gt;
    let declPts = st.skatPts || 0;
    let declTricks = 0;
    for (const t of st.tricks) {
      if (t.winner === st.declarer) {
        declTricks++;
        declPts += sumPts(t.cards.map((x) => x.c));
      }
    }
    if (gt === GT_NULL) declPts = st.tricks.filter((t) => t.winner === st.declarer).reduce((a, t) => a + sumPts(t.cards.map((x) => x.c)), 0);
    const oppPts = 120 - declPts;
    const res = { gt, declPts, oppPts, declTricks, bid: st.bid, overbid: false, items: [], base: 0 };
    if (gt === GT_NULL) {
      res.won = declTricks === 0;
      res.value = nullValue(g.hand, g.ouvert);
      res.items = [{ label: gameLabel(g), v: res.value }];
      res.reason = res.won ? 'Der Alleinspieler hat keinen Stich bekommen.' : 'Der Alleinspieler hat einen Stich bekommen.';
    } else {
      const sp = spitzen(st.declCards12, gt);
      const schneider = declPts >= 90 || declPts <= 30;
      const schwarz = declTricks === st.tricks.length && st.tricks.length === 10 || declTricks === 0;
      const items = levelsFor({ ...sp, hand: g.hand, schneider, schwarz, schneiderAng: g.schneiderAng, schwarzAng: g.schwarzAng, ouvert: g.ouvert });
      const levels = items.reduce((a, i) => a + i.v, 0);
      res.base = BASE[gt];
      res.items = items;
      res.levels = levels;
      res.spitzen = sp;
      let won;
      if (g.schwarzAng || g.ouvert) {
        won = declTricks === 10;
        res.reason = won ? 'Alle Stiche gemacht – Schwarz wie angesagt.' : 'Schwarz war angesagt, aber die Gegner haben einen Stich bekommen.';
      } else if (g.schneiderAng) {
        won = declPts >= 90;
        res.reason = won ? 'Schneider wie angesagt erreicht (' + declPts + ' Augen).' : 'Schneider angesagt, aber nur ' + declPts + ' Augen.';
      } else {
        won = declPts >= 61;
        res.reason = won ? 'Der Alleinspieler hat ' + declPts + ' Augen (mindestens 61).' : 'Der Alleinspieler hat nur ' + declPts + ' Augen (61 nötig).';
      }
      res.value = levels * BASE[gt];
      res.won = won;
      if (res.value < st.bid) {
        res.overbid = true;
        res.won = false;
        res.valueBefore = res.value;
        res.value = Math.ceil(st.bid / BASE[gt]) * BASE[gt];
        res.reason = 'Überreizt: Das Spiel ist nur ' + res.valueBefore + ' wert, gereizt wurde ' + st.bid + '.';
      }
    }
    res.score = res.won ? res.value : -2 * res.value;
    // Seeger-Fabian: +50 / -50 für den Alleinspieler, +40 je Gegenspieler bei verlorenem Spiel
    res.sfDecl = res.won ? res.value + 50 : -2 * res.value - 50;
    res.sfOpp = res.won ? 0 : 40;
    return res;
  }

  // ---------- Spielzustand ----------
  function shuffled(rng) {
    const d = [];
    for (let i = 0; i < 32; i++) d.push(i);
    for (let i = 31; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = d[i]; d[i] = d[j]; d[j] = t;
    }
    return d;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Austeilen wie am Tisch: 3 - Skat 2 - 4 - 3
  function deal(dealer, rng) {
    const d = shuffled(rng || Math.random);
    const hands = [[], [], []];
    const skat = [];
    let i = 0;
    const order = [(dealer + 1) % 3, (dealer + 2) % 3, dealer];
    for (const p of order) for (let k = 0; k < 3; k++) hands[p].push(d[i++]);
    skat.push(d[i++], d[i++]);
    for (const p of order) for (let k = 0; k < 4; k++) hands[p].push(d[i++]);
    for (const p of order) for (let k = 0; k < 3; k++) hands[p].push(d[i++]);
    return { hands, skat };
  }

  function newGame(dealer, dealt) {
    const vh = (dealer + 1) % 3, mh = (dealer + 2) % 3, hh = dealer;
    return {
      phase: 'bidding',
      dealer, vh, mh, hh,
      hands: dealt.hands.map((h) => h.slice()),
      skat: dealt.skat.slice(),
      origHands: dealt.hands.map((h) => h.slice()),
      origSkat: dealt.skat.slice(),
      bidding: { stage: 1, sayer: mh, hearer: vh, bid: 0, waiting: 'say', winner: null, log: [], passed: [false, false, false] },
      declarer: null,

    const shortWay = (v.me + 1) % 3 === D; // Alleinspieler sitzt direkt hinter mir
    if (!sides.length) {
      const c = lowestStr(v, v.hand);
      return { card: c, reason: 'Du hast nur noch Trümpfe. Spiel den kleinsten.', tag: 'trumpf' };
    }
    const declVoid = (s) => knownVoid(v, D, s);
    const declTrumps = v.unseen.some((c) => isT(v, c) && mayHold(v, D, c));
    // Asse und stehende Zehnen
    const masters = sides.filter((c) => isMaster(v, c) && pts(c) >= 10 && !(declVoid(suitOf(c)) && declTrumps)).sort((a, b) => pts(b) - pts(a));
    if (masters.length) {
      const c = masters[0];
      return { card: c, reason: cardName(c) + ' ist die höchste ' + SN[suitOf(c)] + '-Karte, die es noch gibt. Spiel sie jetzt: Später hat der Alleinspieler vielleicht kein ' + SN[suitOf(c)] + ' mehr und sticht sie mit Trumpf.', tag: 'ass' };
    }
    // Partner ist frei, Alleinspieler nicht: Partner kann stechen
    if (v.trickNo > 0) {
      for (let s = 0; s < 4; s++) {
        if (v.gt < 4 && s === v.gt) continue;
        const mine = sides.filter((c) => suitOf(c) === s);
        if (!mine.length) continue;
        const partnerVoid = knownVoid(v, P, s);
        const partnerTrumps = v.unseen.some((c) => isT(v, c) && mayHold(v, P, c));
        if (partnerVoid && partnerTrumps && !declVoid(s)) {
          const c = lowest(v, mine);
          return { card: c, reason: 'Dein Partner hat kein ' + SN[s] + ' mehr – er hat vorhin nicht bedient. Spielst du ' + SN[s] + ', kann er mit Trumpf stechen und den Stich für euch holen.', tag: 'partner' };
        }
      }
    }
    // Kurzer Weg – lange Farbe, langer Weg – kurze Farbe
    const bySuit = {};
    for (const c of sides) (bySuit[suitOf(c)] = bySuit[suitOf(c)] || []).push(c);
    let suits = Object.keys(bySuit).map(Number);
    const nonVoid = suits.filter((s) => !(declVoid(s) && declTrumps));
    if (nonVoid.length) suits = nonVoid;
    const bad10 = (s) => bySuit[s].length === 1 && rankOf(bySuit[s][0]) === 5 && !isMaster(v, bySuit[s][0]);
    suits.sort((a, b) => (shortWay ? bySuit[b].length - bySuit[a].length : bySuit[a].length - bySuit[b].length) || (bad10(a) ? 1 : 0) - (bad10(b) ? 1 : 0));
    const s = suits[0];
    const cands = bySuit[s].filter((c) => !(rankOf(c) === 5 && !isMaster(v, c)));
    const c = lowest(v, cands.length ? cands : bySuit[s]);
    const why = shortWay
      ? 'Der Alleinspieler kommt direkt nach dir. Spiel von der Farbe, von der du viele Karten hast (' + SN[s] + '): Dein Partner kommt nach dem Alleinspieler und kann reagieren. (Merksatz: kurzer Weg – lange Farbe.)'
      : 'Der Alleinspieler kommt als Letzter. Spiel von einer Farbe, von der du nur wenige Karten hast (' + SN[s] + '): Bald hast du sie nicht mehr und darfst selbst stechen. (Merksatz: langer Weg – kurze Farbe.)';
    return { card: c, reason: why, tag: 'weg' };
  }

  function defenderFollow(v, legal) {
    const ts = trickState(v);
    const D = v.declarer, P = v.partner;
    const last = v.trick.length === 2;
    const canFollow = legal.some((c) => eff(v, c) === ts.leadEff);
    const declPlayed = v.trick.some((x) => x.p === D);
    const partnerBest = ts.bestP === P;
    const winners = legal.filter((c) => beats(c, ts.best, v.gt));

    const smear = (why) => {
      let pool = legal.slice();
      if (!canFollow) {
        const side = legal.filter((c) => !isT(v, c));
        if (side.length && Math.max(...side.map(pts)) >= 10) pool = side;
        else {
          const t10 = legal.filter((c) => isT(v, c) && rankOf(c) !== 7 && pts(c) >= 10 && !isMaster(v, c));
          pool = side.length ? side.concat(t10) : legal.filter((c) => rankOf(c) !== 7).concat(legal.filter((c) => rankOf(c) === 7));
        }
      }
      const c = pool.slice().sort((a, b) => pts(b) - pts(a) || (isMaster(v, a) ? 1 : 0) - (isMaster(v, b) ? 1 : 0))[0];
      if (pts(c) === 0) return null;
      return { card: c, reason: why + ' Am meisten bringt ' + cardName(c) + ' (' + pts(c) + ' Augen).', tag: 'schmieren' };
    };

    if (partnerBest) {
      const secure = declPlayed || !threat(v, D, ts.best, ts.leadEff);
      if (secure) {
        const r = smear('Dein Partner gewinnt diesen Stich sicher – gib ihm viele Augen dazu (das heißt schmieren).');
        if (r) return r;
      } else {
        // selbst sicher übernehmen?
        const safeW = winners.filter((c) => !threat(v, D, c, ts.leadEff) && pts(c) >= 10);
        if (safeW.length) {
          const c = safeW.sort((a, b) => pts(b) - pts(a))[0];
          return { card: c, reason: 'Der Alleinspieler könnte die Karte deines Partners schlagen, aber nicht ' + cardName(c) + '. So sicherst du ' + (ts.ptsSoFar + pts(c)) + ' Augen.', tag: 'stich' };
        }
      }
      const c = canFollow ? lowest(v, legal) : discardChoice(v, legal);
      return { card: c, reason: 'Noch ist offen, wer den Stich bekommt – der Alleinspieler kommt nach dir. Gib wenig Augen.', tag: 'klein' };
    }
    // Alleinspieler liegt vorn (oder spielt noch nach mir)
    if (winners.length) {
      const after = ts.after; // Spieler nach mir
      const safe = winners.filter((c) => after.every((p) => p === P || !threat(v, p, c, ts.leadEff)));
      if (safe.length) {
        let pick;
        if (canFollow) {
          const full = safe.filter((c) => pts(c) >= 10).sort((a, b) => pts(b) - pts(a));
          pick = full.length && !isT(v, full[0]) ? full[0] : lowestStr(v, safe);
        } else pick = lowestStr(v, safe);
        const ruff = !canFollow;
        if (!ruff || ts.ptsSoFar >= 3 || last) {
          return { card: pick, reason: (ruff ? 'Stechen: ' : '') + 'Nimm dem Alleinspieler den Stich ab – mit ' + cardName(pick) + ' gehört er sicher euch' + (ts.ptsSoFar + pts(pick) ? ' (' + (ts.ptsSoFar + pts(pick)) + ' Augen)' : '') + '.', tag: 'stich' };
        }
      } else if (!canFollow && ts.ptsSoFar >= 10) {
        const pick = highestStr(v, winners);
        return { card: pick, reason: 'Im Stich liegen viele Augen (' + ts.ptsSoFar + '). Nimm einen hohen Trumpf, damit der Alleinspieler nicht mit einem höheren drüber kann.', tag: 'stich' };
      }
    }
    if (!last && !declPlayed) {
      // Alleinspieler kommt noch: klein bleiben
      const c = canFollow ? lowest(v, legal) : discardChoice(v, legal);
      return { card: c, reason: 'Der Alleinspieler kommt noch nach dir und bekommt den Stich wahrscheinlich. Gib eine Karte mit wenig Augen.', tag: 'klein' };
    }
    const c = canFollow ? lowest(v, legal) : discardChoice(v, legal);
    return { card: c, reason: 'Der Stich geht an den Alleinspieler. Gib ihm so wenig Augen wie möglich.', tag: 'klein' };
  }

  // ================= Nullspiel =================
  function nullDeclarer(v, legal) {
    const gt = v.gt;
    if (!v.trick.length) {
      // sicherste Karte: es gibt höhere ungesehene Karten derselben Farbe, die Gegner bedienen müssen
      let best = null, bestScore = -1e9;
      for (const c of legal) {
        const s = suitOf(c);
        const higher = v.unseen.filter((x) => suitOf(x) === s && strength(x, gt) > strength(c, gt)).length;
        const lower = v.unseen.filter((x) => suitOf(x) === s && strength(x, gt) < strength(c, gt)).length;
        const score = (higher > 0 ? 10 : -50) - lower * 3 + higher - strength(c, gt) * 0.1;
        if (score > bestScore) { bestScore = score; best = c; }
      }
      return { card: best, reason: 'Null: Spiel eine niedrige Karte, die die anderen wahrscheinlich überbieten müssen – so bekommst du keinen Stich.', tag: 'null' };
    }
    const ts = trickState(v);
    const canFollow = legal.some((c) => suitOf(c) === suitOf(ts.cards[0]));
    if (canFollow) {
      const under = legal.filter((c) => !beats(c, ts.best, gt));
      if (under.length) {
        const c = under.sort((a, b) => strength(b, gt) - strength(a, gt))[0];
        return { card: c, reason: 'Null: Bleib unter der höchsten Karte im Stich – und zwar mit der höchsten Karte, die noch drunter passt.', tag: 'null' };
      }
      const c = legal.sort((a, b) => strength(b, gt) - strength(a, gt))[0];
      return { card: c, reason: 'Du kommst nicht drunter. Wenn schon, dann die höchste Karte loswerden.', tag: 'null' };
    }
    // Abwerfen: gefährlichste Karte
    const c = nullDanger(v, legal);
    return { card: c, reason: 'Null: Du kannst nicht bedienen. Wirf deine gefährlichste hohe Karte ab (' + cardName(c) + ') – mit ihr könntest du sonst später einen Stich bekommen.', tag: 'null' };
  }
  function nullDanger(v, cards) {
    const gt = v.gt;
    let best = cards[0], bs = -1e9;
    for (const c of cards) {
      const s = suitOf(c);
      const lowerOut = v.unseen.filter((x) => suitOf(x) === s && strength(x, gt) < strength(c, gt)).length;
      const myLower = v.hand.filter((x) => suitOf(x) === s && strength(x, gt) < strength(c, gt)).length;
      const sc = strength(c, gt) + (lowerOut - myLower) * 2;
      if (sc > bs) { bs = sc; best = c; }
    }
    return best;
  }
  function nullDefender(v, legal) {
    const gt = v.gt, D = v.declarer;
    if (!v.trick.length) {
      let best = null, bs = -1e9;
      for (const c of legal) {
        const s = suitOf(c);
        if (knownVoid(v, D, s)) continue;
        let sc = -strength(c, gt) * 2;
        if (v.ouvertHand) {
          const dh = v.ouvertHand.filter((x) => suitOf(x) === s);
          if (!dh.length) continue;
          const dmin = Math.min(...dh.map((x) => strength(x, gt)));
          sc += dmin > strength(c, gt) ? 30 + dmin - strength(c, gt) : -10;
        }
        if (sc > bs) { bs = sc; best = c; }
      }
      if (best == null) best = legal.sort((a, b) => strength(a, gt) - strength(b, gt))[0];
      return { card: best, reason: 'Gegen Null: Spiel eine niedrige Karte einer Farbe, die der Alleinspieler noch hat – er muss drunter bleiben können.', tag: 'null' };
    }
    const ts = trickState(v);
    const canFollow = legal.some((c) => suitOf(c) === suitOf(ts.cards[0]));
    const declPlayed = v.trick.some((x) => x.p === D);
    if (declPlayed) {
      if (ts.bestP === D) {
        const under = legal.filter((c) => !beats(c, ts.best, gt));
        if (under.length) {
          const c = canFollow ? under.sort((a, b) => strength(b, gt) - strength(a, gt))[0] : nullHighDiscard(v, under);
          return { card: c, reason: 'Der Alleinspieler liegt vorn – bleib drunter, dann bekommt er den Stich.', tag: 'null' };
        }
      }
      const c = canFollow ? legal.sort((a, b) => strength(b, gt) - strength(a, gt))[0] : nullHighDiscard(v, legal);
      return { card: c, reason: 'Der Stich ist für den Alleinspieler verloren. Wirf eine hohe Karte ab.', tag: 'null' };
    }
    // Alleinspieler kommt nach mir: Messlatte niedrig halten
    if (canFollow) {
      const c = legal.sort((a, b) => strength(a, gt) - strength(b, gt))[0];
      return { card: c, reason: 'Der Alleinspieler kommt nach dir. Spiel möglichst niedrig, damit er schwer drunter bleiben kann.', tag: 'null' };
    }
    const c = nullHighDiscard(v, legal);
    return { card: c, reason: 'Du kannst nicht bedienen: Wirf eine hohe Karte ab.', tag: 'null' };
  }
  function nullHighDiscard(v, cards) {
    return cards.slice().sort((a, b) => strength(b, v.gt) - strength(a, v.gt))[0];
  }

  function choose(st, me) {
    const v = makeView(st, me);
    const legal = E.legalFor(st, me);
    if (legal.length === 1) return { card: legal[0], reason: 'Du hast nur diese eine erlaubte Karte.', tag: 'zwang' };
    let r;
    if (v.gt === GT_NULL) r = v.isDecl ? nullDeclarer(v, legal) : nullDefender(v, legal);
    else if (v.isDecl) r = v.trick.length ? declarerFollow(v, legal) : declarerLead(v);
    else r = v.trick.length ? defenderFollow(v, legal) : defenderLead(v);
    if (!r || !legal.includes(r.card)) r = { card: lowest(v, legal), reason: 'Die Karte mit den wenigsten Augen.', tag: 'klein' };
    return r;
  }

  // ---------- Coach: klare Fehler erkennen ----------
  function coach(st, me, played) {
    const v = makeView(st, me);
    const legal = E.legalFor(st, me);
    if (legal.length <= 1 || v.gt === GT_NULL) return null;
    if (!v.trick.length) {
      if (!v.isDecl && isT(v, played) && v.hand.some((c) => !isT(v, c)) && v.trickNo < 6) {
        return 'Als Gegenspieler spielt man selten Trumpf aus – damit hilfst du meist dem Alleinspieler, seine Trümpfe zu sparen.';
      }
      return null;
    }
    const ts = trickState(v);
    const last = v.trick.length === 2;
    if (!last) return null;
    const winsNow = beats(played, ts.best, v.gt);
    const partnerBest = !v.isDecl && ts.bestP === v.partner;
    if (partnerBest) {
      const maxP = Math.max(...legal.map(pts));
      if (pts(played) + 3 < maxP && maxP >= 10) {
        const c = legal.find((x) => pts(x) === maxP);
        return 'Hier hättest du schmieren können: Dein Partner hatte den Stich sicher. ' + cardName(c) + ' hätte euch ' + maxP + ' Augen gebracht.';
      }
      return null;
    }
    // Gegner/Alleinspieler liegt vorn und ich bin letzter
    const winners = legal.filter((c) => beats(c, ts.best, v.gt));
    if (!winsNow && winners.length && ts.ptsSoFar >= 10) {
      return 'Du hättest den Stich mit ' + cardName(lowestStr(v, winners)) + ' gewinnen können – es lagen ' + ts.ptsSoFar + ' Augen drin.';
    }
    if (!winsNow) {
      const minP = Math.min(...legal.map(pts));
      if (pts(played) >= 10 && minP <= 4) {
        return 'Du hast ' + pts(played) + ' Augen an die Gegenseite verschenkt. Wenn du den Stich nicht bekommst, gib die kleinste Karte.';
      }
    }
    return null;
  }

  // ================= Blattbewertung =================
  // Merkmale eines Blattes für eine Spielart
  function featSuit(hand, t) {
    const f = {};
    const has = (c) => hand.includes(c);
    f.cj = has(31) ? 1 : 0; f.sj = has(23) ? 1 : 0; f.hj = has(15) ? 1 : 0; f.dj = has(7) ? 1 : 0;
    const jacks = f.cj + f.sj + f.hj + f.dj;
    const tsuit = hand.filter((c) => suitOf(c) === t && rankOf(c) !== 7);
    f.trumps = jacks + tsuit.length;
    f.tA = has(t * 8 + 6) ? 1 : 0;
    f.t10 = has(t * 8 + 5) ? 1 : 0;
    let aces = 0, a10 = 0, tenNoA = 0, voids = 0, singles = 0, losers = 0, sidePts = 0;
    for (let s = 0; s < 4; s++) {
      if (s === t) continue;
      const cs = hand.filter((c) => suitOf(c) === s && rankOf(c) !== 7);
      const A = cs.some((c) => rankOf(c) === 6), T = cs.some((c) => rankOf(c) === 5), K = cs.some((c) => rankOf(c) === 4);
      sidePts += E.sumPts(cs);
      if (!cs.length) voids++;
      if (cs.length === 1 && !A) singles++;
      if (A) aces++;
      if (A && T) a10++;
      if (T && !A) tenNoA++;
      const standing = A ? (T ? (K ? 3 : 2) : 1) : 0;
      losers += Math.max(0, Math.min(cs.length, 3) - standing);
    }
    Object.assign(f, { aces, a10, tenNoA, voids, singles, losers, sidePts });
    f.tv = Math.min(f.trumps, 7) * voids;
    return f;
  }
  function featGrand(hand) {
    const f = {};
    const has = (c) => hand.includes(c);
    f.cj = has(31) ? 1 : 0; f.sj = has(23) ? 1 : 0; f.hj = has(15) ? 1 : 0; f.dj = has(7) ? 1 : 0;
    f.jacks = f.cj + f.sj + f.hj + f.dj;
    let aces = 0, a10 = 0, tenNoA = 0, losers = 0, standing = 0, longS = 0, voids = 0;
    for (let s = 0; s < 4; s++) {
      const cs = hand.filter((c) => suitOf(c) === s && rankOf(c) !== 7);
      const rs = cs.map(rankOf);
      const A = rs.includes(6), T = rs.includes(5), K = rs.includes(4), D = rs.includes(3);
      if (!cs.length) voids++;
      if (A) aces++;
      if (A && T) a10++;
      if (T && !A) tenNoA++;
      const st = A ? (T ? (K ? (D ? 4 : 3) : 2) : 1) : 0;
      standing += st;
      let l = Math.max(0, cs.length - st);
      if (cs.length >= 5 && st >= 2) l = Math.max(0, l - (cs.length - 4));
      losers += l;
      if (cs.length >= 4 && A && T) longS++;
    }
    Object.assign(f, { aces, a10, tenNoA, losers, standing, longS, voids });
    return f;
  }
  // Lückenregel: Karte i (aufsteigend, 0-basiert) ist sicher, wenn ihr Nullrang <= 2*i
  function featNull(hand) {
    let unsafe = 0, badSuits = 0, highUnsafe = 0, voids = 0, maxR = 0;
    for (let s = 0; s < 4; s++) {
      const rs = hand.filter((c) => suitOf(c) === s).map((c) => E.NULL_STR[rankOf(c)]).sort((a, b) => a - b);
      if (!rs.length) { voids++; continue; }
      let u = 0;
      rs.forEach((r, i) => { if (r > 2 * i) { u++; highUnsafe = Math.max(highUnsafe, r - 2 * i); } });
      unsafe += u;
      if (u) badSuits++;
      maxR = Math.max(maxR, rs[0]);
    }
    return { unsafe, badSuits, highUnsafe, voids, maxLow: maxR };
  }

  const FEATS = {
    suit: ['cj', 'sj', 'hj', 'dj', 'trumps', 'tA', 't10', 'aces', 'a10', 'tenNoA', 'voids', 'singles', 'losers', 'sidePts', 'tv', 'vh', 'skat'],
    grand: ['cj', 'sj', 'hj', 'dj', 'jacks', 'aces', 'a10', 'tenNoA', 'losers', 'standing', 'longS', 'voids', 'vh', 'skat'],
    null: ['unsafe', 'badSuits', 'highUnsafe', 'voids', 'maxLow', 'vh'],
  };
  function features(hand, gt, extra) {
    let f;
    if (gt === GT_NULL) f = featNull(hand);
    else if (gt === GT_GRAND) f = featGrand(hand);
    else f = featSuit(hand, gt);
    f.vh = extra.vh ? 1 : 0;
    f.skat = (extra.skat || 0) / 10;
    return f;
  }
  const kindOf = (gt) => (gt === GT_NULL ? 'null' : gt === GT_GRAND ? 'grand' : 'suit');

  // Modelle werden durch tools/train.mjs erzeugt (logistische Regression)
  let MODELS = G.SKAT_MODELS || null;
  function setModels(m) { MODELS = m; }
  const sigmoid = (x) => 1 / (1 + Math.exp(-x));
  function predict(modelName, kind, f) {
    const m = MODELS && MODELS[modelName] && MODELS[modelName][kind];
    if (!m) return fallbackP(kind, f);
    let z = m.b;
    const names = FEATS[kind];
    for (let i = 0; i < names.length; i++) z += m.w[i] * ((f[names[i]] - m.mu[i]) / m.sd[i]);
    return sigmoid(z);
  }
  function fallbackP(kind, f) {
    if (kind === 'null') return sigmoid(2 - f.unsafe * 1.6);
    if (kind === 'grand') return sigmoid(-4 + f.jacks * 0.9 + f.cj * 0.5 + f.aces * 0.6 + f.a10 * 0.6 - f.losers * 0.5 + f.vh * 0.4);
    return sigmoid(-6 + f.trumps * 0.85 + f.cj * 0.4 + f.sj * 0.2 + f.aces * 0.6 + f.a10 * 0.4 - f.losers * 0.3 + f.voids * 0.2 + f.vh * 0.3);
  }

  // Wahrscheinlichkeit, mit fester Hand (nach dem Drücken / Hand) zu gewinnen
  function pFixed(hand10, gt, vh, skatPts) {
    return predict('post', kindOf(gt), features(hand10, gt, { vh, skat: skatPts }));
  }
  // Wahrscheinlichkeit vor dem Skataufnehmen
  function pBeforeSkat(hand10, gt, vh) {
    return predict('pre', kindOf(gt), features(hand10, gt, { vh, skat: 0 }));
  }

  // Bestes Drücken für Spielart gt bei 12 Karten
  function bestDiscard(cards12, gt, vh) {
    let best = null;
    for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) {
      const d = [cards12[i], cards12[j]];
      const h = cards12.filter((_, k) => k !== i && k !== j);
      const sp = gt === GT_NULL ? 0 : E.sumPts(d);
      let p = pFixed(h, gt, vh, sp);
      if (gt !== GT_NULL && d.some((c) => rankOf(c) === 7)) p -= 0.03; // Buben drückt man nicht
      if (!best || p > best.p + 1e-9 || (Math.abs(p - best.p) < 1e-9 && sp > best.sp)) best = { discard: d, hand: h, p, sp };
    }
    return best;
  }

  const AVG_SKAT = 120 / 32 * 2; // ~7,5 Augen

  // Spielwert-Schätzung beim Reizen (nur eigene 10 Karten)
  function estValue(hand10, gt, handGame) {
    return E.announcedValue(gt, hand10, { hand: handGame });
  }

  // Für das Reizen: beste Optionen mit Gewinnchance
  function bidOptions(hand10, vh) {
    const opts = [];
    for (let gt = 0; gt <= 5; gt++) {
      const p = pBeforeSkat(hand10, gt, vh);
      const pH = pFixed(hand10, gt, vh, gt === GT_NULL ? 0 : AVG_SKAT);
      opts.push({ gt, p, pHand: pH, value: estValue(hand10, gt, false), valueHand: estValue(hand10, gt, true), sp: E.spitzen(hand10, gt) });
    }
    return opts.sort((a, b) => b.p - a.p);
  }
  // Höchster Reizwert, den man noch vertreten kann
  function bidLimit(hand10, vh, risk) {
    const thr = risk == null ? 0.5 : risk;
    let limit = 0, choice = null;
    for (const o of bidOptions(hand10, vh)) {
      if (o.p >= thr && o.value > limit) { limit = o.value; choice = o; }

  const DE_TERMS = [

      if (seg[0] === '<') return seg;

        const hit = GL_MATCH.find(([re]) => re.test(w));
        if (!hit || used.has(hit[1])) return m;
        used.add(hit[1]);

  }
